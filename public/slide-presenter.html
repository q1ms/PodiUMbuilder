<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slide Presenter</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #000; min-height: 100vh; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        #slide { max-width: 100vw; max-height: 100vh; object-fit: contain; display: none; }
        #slide.visible { display: block; animation: fade 200ms ease; }
        @keyframes fade { from { opacity: 0; } to { opacity: 1; } }

        #status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-family: -apple-system, sans-serif;
            font-size: 14px;
            font-weight: 600;
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        #status.hidden { display: none; }

        .controls {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 30px;
            opacity: 0;
            transition: opacity 300ms;
            z-index: 100;
        }
        .controls:hover { opacity: 1; }
        .controls button {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }
        .controls button:hover { background: rgba(255,255,255,0.25); }
        .controls .counter {
            color: #fff;
            font-family: -apple-system, sans-serif;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 12px;
            min-width: 60px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="status">Waiting for slides…</div>
    <img id="slide" alt="Slide" />
    <div class="controls">
        <button id="prevBtn">◀ Prev</button>
        <span class="counter" id="counter">0 / 0</span>
        <button id="nextBtn">Next ▶</button>
        <button id="fullscreenBtn">⛶ Fullscreen</button>
        <button id="closeBtn">✕ Close</button>
    </div>

    <script>
        const channel = new BroadcastChannel('slide_presenter');
        const slideImg = document.getElementById('slide');
        const statusEl = document.getElementById('status');
        const counterEl = document.getElementById('counter');

        let slides = [];
        let currentIndex = 0;

        function render() {
            if (slides.length === 0) {
                statusEl.classList.remove('hidden');
                statusEl.textContent = 'Waiting for slides…';
                slideImg.classList.remove('visible');
                counterEl.textContent = '0 / 0';
                return;
            }
            statusEl.classList.add('hidden');
            slideImg.src = slides[currentIndex];
            slideImg.classList.add('visible');
            counterEl.textContent = `${currentIndex + 1} / ${slides.length}`;
        }

        channel.onmessage = (event) => {
            const data = event.data;
            if (!data) return;

            if (data.action === 'setSlides') {
                slides = data.slides || [];
                currentIndex = data.currentIndex || 0;
                render();
            } else if (data.action === 'setIndex') {
                currentIndex = data.index || 0;
                render();
            } else if (data.action === 'requestSync') {
                // Parent is asking us to sync — we respond via postMessage
                channel.postMessage({ action: 'syncResponse' });
            }
        };

        document.getElementById('prevBtn').onclick = () => {
            channel.postMessage({ action: 'navigate', direction: 'prev' });
        };
        document.getElementById('nextBtn').onclick = () => {
            channel.postMessage({ action: 'navigate', direction: 'next' });
        };
        document.getElementById('closeBtn').onclick = () => window.close();
        document.getElementById('fullscreenBtn').onclick = () => {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        };

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight' || e.key === ' ') {
                e.preventDefault();
                channel.postMessage({ action: 'navigate', direction: 'next' });
            }
            if (e.key === 'ArrowLeft') {
                e.preventDefault();
                channel.postMessage({ action: 'navigate', direction: 'prev' });
            }
            if (e.key === 'f' || e.key === 'F') {
                document.getElementById('fullscreenBtn').click();
            }
            if (e.key === 'Escape' && !document.fullscreenElement) {
                window.close();
            }
        });

        render();
    </script>
</body>
</html>
