<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
        #root { min-height: 100vh; }
        .audio-progress { width: 100%; accent-color: #0d9488; }
        .audio-volume { width: 100px; accent-color: #0d9488; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, createContext, useContext, useCallback } = React;

        // ================================================================
        // AUDIO CONTEXT
        // ================================================================
        const AudioContext = createContext(null);

        const AudioProvider = ({ children, fadeDuration = 800 }) => {
            const [audioUrl, setAudioUrl] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(1.0);
            const [endedCounter, setEndedCounter] = useState(0);
            const [trackName, setTrackName] = useState('');
            const [fadeEnabled, setFadeEnabled] = useState(true);
            const [notification, setNotification] = useState(null); // { id, message, kind }

            const audioRef = useRef(null);
            const fadeIntervalRef = useRef(null);
            const fadeDurationRef = useRef(fadeDuration);
            const loadingTimeoutRef = useRef(null);
            const notifTimerRef = useRef(null);

            useEffect(() => {
                fadeDurationRef.current = fadeDuration;
            }, [fadeDuration]);

            // ============================================================
            // NOTIFICATION HELPER — the ONLY way toast state changes
            // ============================================================
            const notify = (message, kind = 'info', autoHideMs = 2000) => {
                if (notifTimerRef.current) clearTimeout(notifTimerRef.current);
                setNotification({ id: Date.now(), message, kind });
                if (autoHideMs > 0) {
                    notifTimerRef.current = setTimeout(() => {
                        setNotification(null);
                        notifTimerRef.current = null;
                    }, autoHideMs);
                }
            };

            const clearNotification = () => {
                if (notifTimerRef.current) clearTimeout(notifTimerRef.current);
                notifTimerRef.current = null;
                setNotification(null);
            };

            useEffect(() => {
                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audio.preload = 'auto';
                audioRef.current = audio;
                const handleTimeUpdate = () => {
                    if (audio.duration) setProgress((audio.currentTime / audio.duration) * 100);
                };
                const handleLoadedMetadata = () => setDuration(audio.duration);
                const handlePlaying = () => setIsPlaying(true);
                const handlePause = () => setIsPlaying(false);
                const handleEnded = () => {
                    setIsPlaying(false);
                    setProgress(0);
                    setEndedCounter(c => c + 1);
                };
                const handleError = () => {
                    setIsPlaying(false);
                    clearNotification();
                    notify('Could not play audio', 'error', 3000);
                };

                audio.addEventListener('timeupdate', handleTimeUpdate);
                audio.addEventListener('loadedmetadata', handleLoadedMetadata);
                audio.addEventListener('ended', handleEnded);
                audio.addEventListener('playing', handlePlaying);
                audio.addEventListener('pause', handlePause);
                audio.addEventListener('error', handleError);

                return () => {
                    audio.pause();
                    audio.src = '';
                    audio.removeEventListener('timeupdate', handleTimeUpdate);
                    audio.removeEventListener('loadedmetadata', handleLoadedMetadata);
                    audio.removeEventListener('ended', handleEnded);
                    audio.removeEventListener('playing', handlePlaying);
                    audio.removeEventListener('pause', handlePause);
                    audio.removeEventListener('error', handleError);
                    if (loadingTimeoutRef.current) clearTimeout(loadingTimeoutRef.current);
                    if (notifTimerRef.current) clearTimeout(notifTimerRef.current);
                };
            }, []);

            // ===== FADE HELPER =====
            const fadeTo = (targetVol, duration, callback) => {
                const audio = audioRef.current;
                if (!audio) return;
                if (fadeIntervalRef.current) clearInterval(fadeIntervalRef.current);

                // Respect fade enabled state
                const effectiveDuration = fadeEnabled ? duration : 0;

                if (effectiveDuration <= 0) {
                    audio.volume = targetVol;
                    if (callback) callback();
                    return;
                }

                const startVol = audio.volume;
                const startTime = Date.now();

                fadeIntervalRef.current = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const ratio = Math.min(1, elapsed / effectiveDuration);
                    audio.volume = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * ratio));
                    if (ratio >= 1) {
                        clearInterval(fadeIntervalRef.current);
                        fadeIntervalRef.current = null;
                        if (callback) callback();
                    }
                }, 16);
            };

            // ============================================================
            // PLAY — bulletproof notification flow
            // ============================================================
            const play = (url, displayName) => {
                const audio = audioRef.current;
                if (!audio || !url) return;
                const fade = fadeDurationRef.current;

                if (displayName) setTrackName(displayName);

                // Immediately show "Loading music…" (only this line writes the toast)
                notify('Loading music…', 'loading', 0); // autoHideMs=0 means keep visible

                // Safety timeout in case promise never resolves
                if (loadingTimeoutRef.current) clearTimeout(loadingTimeoutRef.current);
                loadingTimeoutRef.current = setTimeout(() => {
                    console.warn('Play timeout — forcing state');
                    notify(`Playing: ${displayName || 'Track'}`, 'playing', 2000);
                }, 8000);

                const currentSrc = audio.src ? audio.src.split('?')[0] : '';
                const targetSrc = url.split('?')[0];
                const isSameTrack = currentSrc === targetSrc;

                const handlePlaySuccess = () => {
                    if (loadingTimeoutRef.current) {
                        clearTimeout(loadingTimeoutRef.current);
                        loadingTimeoutRef.current = null;
                    }
                    setIsPlaying(true);
                    // Replace loading toast with "Playing"
                    notify(`Playing: ${displayName || 'Track'}`, 'playing', 2000);
                    fadeTo(volume, fade);
                };

                const handlePlayFail = (err) => {
                    if (loadingTimeoutRef.current) {
                        clearTimeout(loadingTimeoutRef.current);
                        loadingTimeoutRef.current = null;
                    }
                    console.warn('Play failed:', err);
                    setIsPlaying(false);
                    clearNotification();
                };

                if (!audio.paused && audio.src && !isSameTrack) {
                    fadeTo(0, fade / 2, () => {
                        audio.pause();
                        audio.src = url;
                        audio.load();
                        audio.currentTime = 0;
                        audio.volume = 0;
                        audio.play().then(handlePlaySuccess).catch(handlePlayFail);
                        setAudioUrl(url);
                    });
                } else {
                    if (!isSameTrack) {
                        audio.src = url;
                        audio.load();
                    }
                    audio.currentTime = 0;
                    audio.volume = 0;
                    audio.play().then(handlePlaySuccess).catch(handlePlayFail);
                    setAudioUrl(url);
                }
            };

            // ===== RESUME (keeps position) — used only by Playlist =====
            const resume = () => {
                const audio = audioRef.current;
                if (!audio || !audio.src) return;
                audio.volume = 0;
                audio.play()
                    .then(() => {
                        setIsPlaying(true);
                        fadeTo(volume, fadeDurationRef.current);
                    })
                    .catch(() => {
                        setIsPlaying(false);
                    });
            };

            const pause = () => {
                const audio = audioRef.current;
                if (!audio) return;
                if (loadingTimeoutRef.current) {
                    clearTimeout(loadingTimeoutRef.current);
                    loadingTimeoutRef.current = null;
                }
                clearNotification();  // ← Always clear loading toast on pause
                fadeTo(0, fadeDurationRef.current / 2, () => {
                    audio.pause();
                    setIsPlaying(false);
                });
            };

            const stopAll = () => {
                const audio = audioRef.current;
                if (!audio) return;
                if (loadingTimeoutRef.current) {
                    clearTimeout(loadingTimeoutRef.current);
                    loadingTimeoutRef.current = null;
                }
                clearNotification();
                fadeTo(0, fadeDurationRef.current / 2, () => {
                    audio.pause();
                    setIsPlaying(false);
                });
            };

            const resetAll = () => {
                const audio = audioRef.current;
                if (!audio) return;
                if (loadingTimeoutRef.current) {
                    clearTimeout(loadingTimeoutRef.current);
                    loadingTimeoutRef.current = null;
                }
                clearNotification();
                fadeTo(0, fadeDurationRef.current / 2, () => {
                    audio.pause();
                    audio.currentTime = 0;
                    setIsPlaying(false);
                    setProgress(0);
                    setAudioUrl(null);
                    setTrackName('');
                });
            };

            const togglePlay = (url, displayName) => {
                if (!url) return;
                if (audioUrl === url && isPlaying) pause();
                else play(url, displayName);
            };

            const seek = (value) => {
                const audio = audioRef.current;
                if (!audio || !audio.duration) return;
                audio.currentTime = (value / 100) * audio.duration;
                setProgress(value);
            };

            const changeVolume = (val) => {
                const v = val / 100;
                setVolume(v);
                if (audioRef.current && !fadeIntervalRef.current) {
                    audioRef.current.volume = v;
                }
            };

            const playBeep = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.frequency.value = 880;
                    osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.start(ctx.currentTime);
                    osc.stop(ctx.currentTime + 0.15);
                } catch (e) {}
            };

            return (
                <AudioContext.Provider value={{
                    audioUrl, isPlaying, progress, duration, volume,
                    trackName, setTrackName,
                    fadeEnabled, setFadeEnabled,
                    play, resume, pause, stopAll, resetAll,
                    togglePlay, seek, changeVolume, playBeep, endedCounter,
                    notification,
                }}>
                    {children}
                </AudioContext.Provider>
            );
        };

        // ================================================================
        // BLOCK RENDERERS (view-only, playable)
        // ================================================================
        function formatTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        const SoundButtonBlock = ({ props, audioCtx }) => {
            const buttonLabel = props.label || 'Sound Button';
            const isThisPlaying = audioCtx.audioUrl === props.audioUrl && audioCtx.isPlaying;

            return (
                <div style={{ marginBottom: 20 }}>
                    <button
                        onClick={() => {
                            if (props.audioUrl) {
                                audioCtx.togglePlay(props.audioUrl, buttonLabel);
                            } else {
                                audioCtx.playBeep();
                            }
                        }}
                        style={{
                            background: `linear-gradient(135deg, ${props.color || '#11233B'} 0%, ${props.color || '#11233B'}dd 100%)`,
                            width: '100%',
                            padding: '22px 24px',
                            borderRadius: 16,
                            border: 'none',
                            color: '#fff',
                            fontFamily: 'inherit',
                            fontSize: 16,
                            fontWeight: 700,
                            letterSpacing: '-0.01em',
                            cursor: 'pointer',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            gap: 12,
                            transition: 'all 200ms cubic-bezier(0.34, 1.56, 0.64, 1)',
                            boxShadow: `0 8px 24px ${props.color || '#11233B'}40, 0 2px 6px rgba(0,0,0,0.1)`,
                        }}
                        onMouseDown={(e) => { e.currentTarget.style.transform = 'scale(0.97)'; }}
                        onMouseUp={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
                        onMouseLeave={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
                    >
                        {audioCtx.notification && audioCtx.notification.kind === 'loading' && audioCtx.notification.message === 'Loading music…' && audioCtx.audioUrl === props.audioUrl ? (
                            <i className="fas fa-spinner fa-spin" style={{ fontSize: 18 }}></i>
                        ) : (
                            <i className={`fas ${isThisPlaying ? 'fa-pause' : 'fa-play'}`} style={{ fontSize: 18 }}></i>
                        )}
                        <span>{buttonLabel}</span>
                    </button>
                </div>
            );
        };

        const PlaylistBlock = ({ props, audioCtx }) => {
            const tracks = props.tracks || [];
            const [currentIdx, setCurrentIdx] = useState(null);
            const [isPlaylistActive, setIsPlaylistActive] = useState(false);
            const [isPlaylistPlaying, setIsPlaylistPlaying] = useState(false);

            // ============================================================
            // AUTO-ADVANCE — only fires when a track naturally ENDS
            // (uses endedCounter, not isPlaying, so pause doesn't trigger it)
            // ============================================================
            const lastHandledEndRef = useRef(0);
            useEffect(() => {
                if (!isPlaylistPlaying || currentIdx === null) return;
                if (!audioCtx.endedCounter) return;
                // Avoid double-firing on the same ended event
                if (audioCtx.endedCounter === lastHandledEndRef.current) return;
                lastHandledEndRef.current = audioCtx.endedCounter;

                const nextIdx = currentIdx + 1;
                if (nextIdx < tracks.length) {
                    setCurrentIdx(nextIdx);
                    audioCtx.play(tracks[nextIdx].url, tracks[nextIdx].name);  // ← pass name
                } else {
                    // End of playlist — reset
                    setIsPlaylistPlaying(false);
                    setIsPlaylistActive(false);
                    setCurrentIdx(null);
                }
            }, [audioCtx.endedCounter, isPlaylistPlaying, currentIdx, tracks]);

            // If user plays a different track externally, stop playlist mode
            useEffect(() => {
                if (!isPlaylistActive) return;
                if (currentIdx === null) return;
                if (audioCtx.audioUrl && audioCtx.audioUrl !== tracks[currentIdx]?.url) {
                    setIsPlaylistPlaying(false);
                    setIsPlaylistActive(false);
                    setCurrentIdx(null);
                }
            }, [audioCtx.audioUrl]);

            const handlePlayPause = () => {
                if (tracks.length === 0) return;

                // CASE 1: Playing → pause (keep currentIdx + currentTime)
                if (isPlaylistPlaying && audioCtx.isPlaying) {
                    audioCtx.pause();
                    setIsPlaylistPlaying(false);
                    return;
                }

                // CASE 2: Paused mid-track → RESUME from current position
                if (isPlaylistActive && currentIdx !== null && audioCtx.audioUrl === tracks[currentIdx]?.url) {
                    setIsPlaylistPlaying(true);
                    audioCtx.resume();   // ← keeps position
                    return;
                }

                // CASE 3: Fresh start
                setIsPlaylistActive(true);
                setIsPlaylistPlaying(true);
                setCurrentIdx(0);
                audioCtx.play(tracks[0].url, tracks[0].name);  // ← pass name
            };

            const stopPlaylist = () => {
                setIsPlaylistPlaying(false);
                setIsPlaylistActive(false);
                setCurrentIdx(null);
                audioCtx.resetAll();  // ← full reset for Stop & Reset
            };

            const playTrack = (idx) => {
                // If clicking the same paused track, just resume
                if (isPlaylistActive && currentIdx === idx && !audioCtx.isPlaying) {
                    setIsPlaylistPlaying(true);
                    audioCtx.resume();
                    return;
                }
                // Otherwise start that track fresh
                setCurrentIdx(idx);
                setIsPlaylistActive(true);
                setIsPlaylistPlaying(true);
                audioCtx.play(tracks[idx].url, tracks[idx].name);  // ← pass name
            };

            // Button label logic
            let buttonLabel = 'Play Playlist';
            let buttonIcon = 'fa-play';
            let buttonColor = 'var(--color-navy)';

            if (isPlaylistPlaying && audioCtx.isPlaying) {
                buttonLabel = 'Pause Playlist';
                buttonIcon = 'fa-pause';
                buttonColor = '#F59E0B';
            } else if (isPlaylistActive && currentIdx !== null) {
                buttonLabel = `Resume · ${tracks[currentIdx]?.name || ''}`;
                buttonIcon = 'fa-play';
                buttonColor = 'var(--color-brand)';
            }

            return (
                <div className="viewer-playlist">
                    <div className="viewer-playlist-title">{props.title || 'Playlist'}</div>

                    {tracks.length > 0 && (
                        <>
                            <button
                                onClick={handlePlayPause}
                                style={{
                                    width: '100%',
                                    padding: '18px',
                                    borderRadius: '14px',
                                    background: buttonColor,
                                    color: '#fff',
                                    border: 'none',
                                    fontFamily: 'inherit',
                                    fontSize: '16px',
                                    fontWeight: 700,
                                    cursor: 'pointer',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    gap: '12px',
                                    marginBottom: isPlaylistActive ? '10px' : '16px',
                                    boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
                                    transition: 'all 150ms',
                                }}
                            >
                                <i className={`fas ${buttonIcon}`} style={{ fontSize: '18px' }}></i>
                                {buttonLabel}
                            </button>

                            {/* Stop button — only shows when playlist is active */}
                            {isPlaylistActive && (
                                <button
                                    onClick={stopPlaylist}
                                    style={{
                                        width: '100%',
                                        padding: '10px',
                                        borderRadius: '10px',
                                        background: 'transparent',
                                        color: 'var(--color-gray)',
                                        border: '1px solid var(--color-gray-lighter)',
                                        fontFamily: 'inherit',
                                        fontSize: '13px',
                                        fontWeight: 600,
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        gap: '8px',
                                        marginBottom: '16px',
                                        transition: 'all 150ms',
                                    }}
                                >
                                    <i className="fas fa-stop"></i> Stop & Reset
                                </button>
                            )}
                        </>
                    )}

                    {tracks.length === 0 ? (
                        <div style={{ textAlign: 'center', color: 'var(--color-gray-light)', fontSize: 13, padding: '20px 0' }}>
                            No tracks added yet
                        </div>
                    ) : (
                        tracks.map((track, i) => {
                            const isCurrent = currentIdx === i;
                            const isPlayingThis = isCurrent && audioCtx.isPlaying && isPlaylistPlaying;
                            return (
                                <div
                                    key={i}
                                    className={`viewer-track ${isPlayingThis ? 'playing' : ''}`}
                                    onClick={() => playTrack(i)}
                                >
                                    <div className="viewer-track-icon" style={isCurrent && !isPlayingThis ? { background: 'var(--color-gray)' } : undefined}>
                                        <i className={`fas ${isPlayingThis ? 'fa-pause' : 'fa-play'}`}></i>
                                    </div>
                                    <div className="viewer-track-name">
                                        {track.name}
                                        {isCurrent && !isPlayingThis && (
                                            <span style={{ fontSize: 11, color: 'var(--color-gray-light)', marginLeft: 8 }}>
                                                (paused)
                                            </span>
                                        )}
                                    </div>
                                    {isPlayingThis && (
                                        <div style={{ fontSize: 11, color: 'var(--color-brand)', fontWeight: 600 }}>
                                            ● LIVE
                                        </div>
                                    )}
                                </div>
                            );
                        })
                    )}
                </div>
            );
        };

        const CustomUploadsBlock = ({ props }) => (
            <div className="mb-4">
                <div className="text-sm font-semibold text-gray-700 mb-1">{props.title || 'Custom Uploads'}</div>
                {props.subtitle && <div className="text-xs text-gray-400 mb-2">{props.subtitle}</div>}
                <div className="border-2 border-dashed border-gray-300 rounded-xl py-6 text-center text-sm text-gray-400 cursor-pointer hover:border-gray-400 transition-colors">
                    <label className="cursor-pointer block">
                        <span>🎵 Click to browse audio</span>
                        <input type="file" accept="audio/*" className="hidden"
                            onChange={(e) => {
                                const file = e.target.files[0];
                                if (file) {
                                    const url = URL.createObjectURL(file);
                                    window.__audioCtx?.play(url);
                                }
                            }} />
                    </label>
                </div>
            </div>
        );

        const SlidesManagerBlock = ({ props }) => {
            const [slides, setSlides] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [fullscreen, setFullscreen] = useState(false);
            const [autoplay, setAutoplay] = useState(false);
            const [autoplayProgress, setAutoplayProgress] = useState(0);

            // ============================================================
            // BROADCAST CHANNEL — opens once, closes on unmount
            // ============================================================
            const channelRef = useRef(null);
            const presenterWindowRef = useRef(null);

            // Keep refs in sync with latest values
            const slidesRef = useRef(slides);
            const currentIndexRef = useRef(currentIndex);

            const AUTOPLAY_DURATION = 5000; // 5 seconds per slide

            const handleFiles = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                const newSlides = [];
                for (const file of files) {
                    if (file.type === 'application/pdf') {
                        // Load PDF
                        if (!window.pdfjsLib) {
                            await new Promise((resolve) => {
                                const script = document.createElement('script');
                                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                                script.onload = () => {
                                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                                    resolve();
                                };
                                document.head.appendChild(script);
                            });
                        }
                        const buffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const viewport = page.getViewport({ scale: 2 });
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                            newSlides.push(canvas.toDataURL('image/png'));
                        }
                    } else if (file.type.startsWith('image/')) {
                        const dataURL = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve(ev.target.result);
                            reader.readAsDataURL(file);
                        });
                        newSlides.push(dataURL);
                    }
                }
                setSlides(prev => [...prev, ...newSlides]);
                e.target.value = '';
            };

            const goNext = () => slides.length && setCurrentIndex((currentIndex + 1) % slides.length);
            const goPrev = () => slides.length && setCurrentIndex((currentIndex - 1 + slides.length) % slides.length);
            const goTo = (idx) => setCurrentIndex(idx);

            const deleteSlide = (idx) => {
                const updated = slides.filter((_, i) => i !== idx);
                setSlides(updated);
                if (currentIndex >= updated.length) setCurrentIndex(Math.max(0, updated.length - 1));
            };

            const moveSlide = (idx, direction) => {
                const newIdx = idx + direction;
                if (newIdx < 0 || newIdx >= slides.length) return;
                const updated = [...slides];
                [updated[idx], updated[newIdx]] = [updated[newIdx], updated[idx]];
                setSlides(updated);
                if (currentIndex === idx) setCurrentIndex(newIdx);
                else if (currentIndex === newIdx) setCurrentIndex(idx);
            };

            // Keyboard controls (both preview and fullscreen)
            useEffect(() => {
                const handleKey = (e) => {
                    if (!fullscreen && !autoplay) return;
                    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
                    if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
                    if (e.key === 'Escape') setFullscreen(false);
                    if (e.key === 'f' || e.key === 'F') setFullscreen(f => !f);
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [fullscreen, autoplay, slides.length, currentIndex]);

            // Autoplay
            useEffect(() => {
                if (!autoplay || slides.length <= 1) return;
                setAutoplayProgress(0);
                const startTime = Date.now();
                const interval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(100, (elapsed / AUTOPLAY_DURATION) * 100);
                    setAutoplayProgress(progress);
                    if (elapsed >= AUTOPLAY_DURATION) {
                        goNext();
                        setAutoplayProgress(0);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, [autoplay, currentIndex, slides.length]);

            useEffect(() => { slidesRef.current = slides; }, [slides]);
            useEffect(() => { currentIndexRef.current = currentIndex; }, [currentIndex]);

            // Open channel ONCE on mount
            useEffect(() => {
                const ch = new BroadcastChannel('slide_presenter');
                channelRef.current = ch;

                ch.onmessage = (e) => {
                    const data = e.data;
                    if (!data) return;
                    if (data.action === 'navigate') {
                        if (data.direction === 'next') {
                            setCurrentIndex(prev => {
                                const newIdx = slidesRef.current.length
                                    ? (prev + 1) % slidesRef.current.length
                                    : 0;
                                return newIdx;
                            });
                        } else if (data.direction === 'prev') {
                            setCurrentIndex(prev => {
                                const len = slidesRef.current.length;
                                const newIdx = len ? (prev - 1 + len) % len : 0;
                                return newIdx;
                            });
                        }
                    }
                };

                return () => {
                    ch.close();
                    channelRef.current = null;
                };
            }, []); // ← empty deps = opens once, closes on unmount

            // Safe broadcast helper
            const broadcast = (message) => {
                if (channelRef.current) {
                    try {
                        channelRef.current.postMessage(message);
                    } catch (e) {
                        // Channel was closed between check and post — ignore
                        console.warn('Broadcast skipped:', e.message);
                    }
                }
            };

            // Broadcast when slides change
            useEffect(() => {
                broadcast({ action: 'setSlides', slides, currentIndex: currentIndexRef.current });
            }, [slides]);

            // Broadcast when current index changes
            useEffect(() => {
                broadcast({ action: 'setIndex', index: currentIndex });
            }, [currentIndex]);

            // ============================================================
            // OPEN PRESENTER WINDOW
            // ============================================================
            const openPresenter = () => {
                if (slides.length === 0) {
                    alert('Upload slides first before presenting.');
                    return;
                }

                // If window exists and is open, focus it and re-sync
                if (presenterWindowRef.current && !presenterWindowRef.current.closed) {
                    presenterWindowRef.current.focus();
                    broadcast({
                        action: 'setSlides',
                        slides: slidesRef.current,
                        currentIndex: currentIndexRef.current,
                    });
                    return;
                }

                // Open new window
                const win = window.open(
                    '/slide-presenter.html',
                    'slide_presenter_window',
                    'width=1280,height=720,menubar=no,toolbar=no'
                );
                presenterWindowRef.current = win;

                // Send slides after the new window is ready
                if (win) {
                    // Try sending after 500ms, then again at 1200ms for safety
                    setTimeout(() => {
                        broadcast({
                            action: 'setSlides',
                            slides: slidesRef.current,
                            currentIndex: currentIndexRef.current,
                        });
                    }, 500);
                    setTimeout(() => {
                        broadcast({
                            action: 'setSlides',
                            slides: slidesRef.current,
                            currentIndex: currentIndexRef.current,
                        });
                    }, 1200);
                }
            };

            // Cleanup: close presenter window on unmount
            useEffect(() => {
                return () => {
                    if (presenterWindowRef.current && !presenterWindowRef.current.closed) {
                        presenterWindowRef.current.close();
                    }
                };
            }, []);

            return (
                <div className="slide-presenter">
                    {props.title && <div className="viewer-playlist-title">{props.title}</div>}

                    {/* Upload zone */}
                    <div className="border-2 border-dashed border-gray-200 rounded-xl py-4 text-center text-sm text-gray-400 hover:border-gray-400 transition-colors cursor-pointer mb-4">
                        <label className="cursor-pointer block">
                            <span>📄 Click to upload PDF / PNG / JPEG</span>
                            <input type="file" multiple accept="image/*,application/pdf" className="hidden" onChange={handleFiles} />
                        </label>
                    </div>

                    {slides.length > 0 && (
                        <>
                            {/* Viewport */}
                            <div className="slide-viewport" onClick={() => setFullscreen(true)} style={{ cursor: 'zoom-in' }}>
                                <img src={slides[currentIndex]} alt={`Slide ${currentIndex + 1}`} />
                                {autoplay && (
                                    <div className="slide-autoplay-bar" style={{ width: autoplayProgress + '%' }}></div>
                                )}
                            </div>

                            {/* Navigation */}
                            <div className="slide-nav">
                                <button className="btn btn-secondary btn-sm" onClick={goPrev}>
                                    <i className="fas fa-chevron-left"></i> Prev
                                </button>
                                <div className="slide-counter">
                                    {currentIndex + 1} / {slides.length}
                                </div>
                                <button className="btn btn-secondary btn-sm" onClick={goNext}>
                                    Next <i className="fas fa-chevron-right"></i>
                                </button>
                            </div>

                            {/* Secondary controls */}
                            <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
                                <button className="btn btn-primary btn-sm" onClick={() => setFullscreen(true)}>
                                    <i className="fas fa-expand"></i> Fullscreen
                                </button>
                                <button className="btn btn-sm" style={{
                                    background: 'var(--color-navy)',
                                    color: '#fff',
                                    border: 'none',
                                    padding: '8px 16px',
                                    borderRadius: 30,
                                    fontFamily: 'inherit',
                                    fontSize: 13,
                                    fontWeight: 600,
                                    cursor: 'pointer',
                                    display: 'inline-flex',
                                    alignItems: 'center',
                                    gap: 8,
                                }} onClick={openPresenter}>
                                    <i className="fas fa-external-link-alt"></i> Present in New Tab
                                </button>
                                <button
                                    className={`btn btn-sm ${autoplay ? 'btn-danger' : 'btn-secondary'}`}
                                    onClick={() => setAutoplay(!autoplay)}
                                >
                                    <i className={`fas ${autoplay ? 'fa-pause' : 'fa-play'}`}></i>
                                    {autoplay ? ' Stop' : ' Auto-advance'}
                                </button>
                            </div>

                            {/* Thumbnails */}
                            <div className="slide-thumbs">
                                {slides.map((s, i) => (
                                    <div key={i} className={`slide-thumb-item ${i === currentIndex ? 'active' : ''}`}>
                                        <img src={s} alt={`Slide ${i + 1}`} onClick={() => goTo(i)} />
                                        <span className="thumb-num">{i + 1}</span>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', padding: 2 }}>
                                            <button
                                                onClick={(e) => { e.stopPropagation(); moveSlide(i, -1); }}
                                                disabled={i === 0}
                                                style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 10, color: '#64748B', padding: 2 }}
                                                title="Move left"
                                            >◀</button>
                                            <button
                                                onClick={(e) => { e.stopPropagation(); deleteSlide(i); }}
                                                style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 10, color: '#EF4444', padding: 2 }}
                                                title="Delete"
                                            >✕</button>
                                            <button
                                                onClick={(e) => { e.stopPropagation(); moveSlide(i, 1); }}
                                                disabled={i === slides.length - 1}
                                                style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 10, color: '#64748B', padding: 2 }}
                                                title="Move right"
                                            >▶</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}

                    {/* Fullscreen mode */}
                    {fullscreen && (
                        <div className="slide-fullscreen" onClick={(e) => { if (e.target === e.currentTarget) setFullscreen(false); }}>
                            <img src={slides[currentIndex]} alt={`Slide ${currentIndex + 1}`} />
                            {autoplay && (
                                <div className="slide-autoplay-bar" style={{
                                    position: 'fixed',
                                    bottom: 0,
                                    left: 0,
                                    height: 4,
                                    width: autoplayProgress + '%',
                                    background: 'var(--color-brand)',
                                    transition: 'width 100ms linear',
                                    zIndex: 100000,
                                }}></div>
                            )}
                            <div className="slide-fullscreen-controls">
                                <button onClick={goPrev} title="Previous (←)"><i className="fas fa-chevron-left"></i></button>
                                <span className="fs-counter">{currentIndex + 1} / {slides.length}</span>
                                <button onClick={goNext} title="Next (→ or Space)"><i className="fas fa-chevron-right"></i></button>
                                <div style={{ width: 1, height: 20, background: 'rgba(255,255,255,0.2)' }}></div>
                                <button onClick={() => setAutoplay(!autoplay)} title="Auto-advance">
                                    <i className={`fas ${autoplay ? 'fa-pause' : 'fa-play'}`}></i>
                                </button>
                                <button onClick={() => setFullscreen(false)} title="Exit (Esc)"><i className="fas fa-times"></i></button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const DividerBlock = ({ props }) => (
            <div className="flex items-center gap-3 my-4">
                <div className="flex-1 h-0.5 rounded" style={{ background: props.color || '#d1d5db' }}></div>
                {props.label && <span className="text-sm font-semibold text-gray-500 tracking-wide">{props.label}</span>}
                <div className="flex-1 h-0.5 rounded" style={{ background: props.color || '#d1d5db' }}></div>
            </div>
        );

        function renderBlock(item, audioCtx, media) {
            const { type, props } = item;
            switch (type) {
                case 'SoundButton': return <SoundButtonBlock key={item.id} props={props} audioCtx={audioCtx} media={media} />;
                case 'Playlist': return <PlaylistBlock key={item.id} props={props} audioCtx={audioCtx} media={media} />;
                case 'CustomUploads': return <CustomUploadsBlock key={item.id} props={props} />;
                case 'SlidesManager': return <SlidesManagerBlock key={item.id} props={props} />;
                case 'Divider': return <DividerBlock key={item.id} props={props} />;
                default: return null;
            }
        }

        // ================================================================
        // FLOATING AUDIO PLAYER (fixed bottom bar)
        // ================================================================
        const FloatingAudioPlayer = ({ audioCtx, visible }) => {
            if (!visible) return null;

            const trackName = audioCtx.trackName || (audioCtx.audioUrl
                ? decodeURIComponent(audioCtx.audioUrl.split('/').pop().split('?')[0]).replace(/\.[^.]+$/, '')
                : 'Ready');

            const formatTime = (s) => {
                if (!s || isNaN(s)) return '0:00';
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return `${m}:${sec.toString().padStart(2, '0')}`;
            };

            const hasAudio = !!audioCtx.audioUrl;
            const progressPercent = audioCtx.progress || 0;

            return (
                <div
                    style={{
                        position: 'fixed',
                        bottom: 0,
                        left: 0,
                        right: 0,
                        zIndex: 9999,
                        background: 'rgba(17, 35, 59, 0.98)',
                        backdropFilter: 'blur(24px) saturate(180%)',
                        WebkitBackdropFilter: 'blur(24px) saturate(180%)',
                        borderTop: '1px solid rgba(255,255,255,0.08)',
                        padding: '14px 24px',
                        color: '#fff',
                        boxShadow: '0 -8px 40px rgba(0,0,0,0.25)',
                        fontFamily: 'inherit',
                        animation: 'playerSlideUp 400ms cubic-bezier(0.34, 1.56, 0.64, 1)',
                    }}
                >
                    <div style={{ maxWidth: 1000, margin: '0 auto', display: 'flex', alignItems: 'center', gap: 18 }}>
                        {/* Thin progress bar at top */}
                        <div style={{ position: 'absolute', top: 0, left: 0, right: 0, height: 2, background: 'rgba(255,255,255,0.06)' }}>
                            <div style={{ height: '100%', width: progressPercent + '%', background: 'linear-gradient(90deg, #0090A8, #00A3C4)', transition: 'width 200ms linear', borderRadius: '0 2px 2px 0', boxShadow: '0 0 8px rgba(0, 144, 168, 0.6)' }}></div>
                        </div>
                        {/* Track info */}
                        <div style={{ flex: '0 0 auto', maxWidth: 220, minWidth: 120 }}>
                            <div style={{ display: 'flex', alignItems: 'center', gap: 6, fontSize: 10, letterSpacing: '0.15em', textTransform: 'uppercase', opacity: 0.5, marginBottom: 2, fontWeight: 600 }}>
                                {audioCtx.notification && audioCtx.notification.kind === 'loading' ? (<><span style={{ width: 6, height: 6, borderRadius: '50%', background: '#F59E0B', animation: 'pulse 1s ease infinite' }}></span>LOADING</>) : audioCtx.isPlaying ? (<><span style={{ width: 6, height: 6, borderRadius: '50%', background: '#10B981', boxShadow: '0 0 8px #10B981', animation: 'pulse 1.5s ease infinite' }}></span>NOW PLAYING</>) : (<><span style={{ width: 6, height: 6, borderRadius: '50%', background: 'rgba(255,255,255,0.3)' }}></span>READY</>)}
                            </div>
                            <div style={{ fontSize: 14, fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', letterSpacing: '-0.01em' }}>
                                {trackName}
                            </div>
                        </div>

                        {/* Play/Pause button */}
                        <button
                            onClick={() => audioCtx.audioUrl && audioCtx.togglePlay(audioCtx.audioUrl, audioCtx.trackName)}
                            disabled={!hasAudio}
                            style={{
                                width: 52,
                                height: 52,
                                borderRadius: '50%',
                                background: hasAudio ? 'linear-gradient(135deg, #0090A8, #00A3C4)' : 'rgba(255,255,255,0.08)',
                                border: 'none',
                                color: '#fff',
                                cursor: hasAudio ? 'pointer' : 'not-allowed',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                flexShrink: 0,
                                fontSize: 16,
                                boxShadow: hasAudio ? '0 4px 20px rgba(0, 144, 168, 0.4)' : 'none',
                                transition: 'all 200ms cubic-bezier(0.34, 1.56, 0.64, 1)',
                            }}
                            onMouseDown={(e) => { e.currentTarget.style.transform = 'scale(0.94)'; }}
                            onMouseUp={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
                            onMouseLeave={(e) => { e.currentTarget.style.transform = 'scale(1)'; }}
                        >
                            {audioCtx.notification && audioCtx.notification.kind === 'loading' ? (<i className="fas fa-spinner fa-spin"></i>) : (<i className={`fas ${audioCtx.isPlaying ? 'fa-pause' : 'fa-play'}`}></i>)}
                        </button>

                        {/* Progress + time */}
                        <div style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 12, minWidth: 0 }}>
                            <span style={{ fontSize: 12, opacity: 0.5, minWidth: 38, textAlign: 'right', fontVariantNumeric: 'tabular-nums', fontWeight: 500 }}>
                                {audioCtx.duration ? formatTime((audioCtx.progress / 100) * audioCtx.duration) : '0:00'}
                            </span>
                            <input
                                type="range"
                                min="0"
                                max="100"
                                value={progressPercent}
                                onChange={(e) => audioCtx.seek(parseFloat(e.target.value))}
                                disabled={!hasAudio}
                                style={{ flex: 1, accentColor: '#0090A8', cursor: hasAudio ? 'pointer' : 'not-allowed' }}
                            />
                            <span style={{ fontSize: 12, opacity: 0.5, minWidth: 38, fontVariantNumeric: 'tabular-nums', fontWeight: 500 }}>
                                {audioCtx.duration ? formatTime(audioCtx.duration) : '0:00'}
                            </span>
                        </div>

                        {/* Volume */}
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10, flex: '0 0 auto' }}>
                            <i className={`fas ${audioCtx.volume === 0 ? 'fa-volume-mute' : audioCtx.volume < 0.5 ? 'fa-volume-down' : 'fa-volume-up'}`} style={{ fontSize: 13, opacity: 0.7, cursor: 'pointer' }} onClick={() => audioCtx.changeVolume(audioCtx.volume === 0 ? 100 : 0)}></i>
                            <input
                                type="range"
                                min="0"
                                max="100"
                                value={audioCtx.volume * 100}
                                onChange={(e) => audioCtx.changeVolume(parseFloat(e.target.value))}
                                style={{ width: 90, accentColor: '#0090A8', cursor: 'pointer' }}
                            />
                        </div>

                        {/* Fade toggle */}
                        <label style={{
                            display: 'flex',
                            alignItems: 'center',
                            gap: 8,
                            fontSize: 12,
                            cursor: 'pointer',
                            userSelect: 'none',
                            flexShrink: 0,
                            padding: '8px 14px',
                            background: audioCtx.fadeEnabled ? 'rgba(0, 144, 168, 0.15)' : 'rgba(255,255,255,0.05)',
                            borderRadius: 10,
                            border: `1px solid ${audioCtx.fadeEnabled ? 'rgba(0, 144, 168, 0.4)' : 'rgba(255,255,255,0.1)'}`,
                            transition: 'all 200ms',
                            fontWeight: 600,
                            color: audioCtx.fadeEnabled ? '#4FD1C5' : 'rgba(255,255,255,0.6)',
                        }}>
                            <input
                                type="checkbox"
                                checked={audioCtx.fadeEnabled}
                                onChange={(e) => audioCtx.setFadeEnabled(e.target.checked)}
                                style={{ accentColor: '#0090A8', cursor: 'pointer', width: 14, height: 14 }}
                            />
                            Fade
                        </label>
                    </div>
                </div>
            );
        };

        // ================================================================
        // LOADING TOAST (top-right notification)
        // ================================================================
        const LoadingToast = ({ audioCtx }) => {
            const notif = audioCtx.notification;
            if (!notif) return null;

            const config = {
                loading: {
                    bg: 'linear-gradient(135deg, #F59E0B 0%, #D97706 100%)',
                    icon: 'fa-spinner fa-spin',
                    shadow: 'rgba(217, 119, 6, 0.4)',
                },
                playing: {
                    bg: 'linear-gradient(135deg, #10B981 0%, #059669 100%)',
                    icon: 'fa-play',
                    shadow: 'rgba(5, 150, 105, 0.4)',
                },
                error: {
                    bg: 'linear-gradient(135deg, #EF4444 0%, #DC2626 100%)',
                    icon: 'fa-exclamation-triangle',
                    shadow: 'rgba(220, 38, 38, 0.4)',
                },
            };

            const c = config[notif.kind] || config.playing;

            return (
                <div
                    key={notif.id}
                    style={{
                        position: 'fixed',
                        top: 24,
                        right: 24,
                        background: c.bg,
                        color: '#fff',
                        padding: '14px 22px',
                        borderRadius: 16,
                        boxShadow: `0 12px 40px ${c.shadow}, 0 4px 12px rgba(0,0,0,0.15)`,
                        display: 'flex',
                        alignItems: 'center',
                        gap: 14,
                        fontSize: 15,
                        fontWeight: 600,
                        fontFamily: 'inherit',
                        zIndex: 100000,
                        animation: 'toastSlideIn 350ms cubic-bezier(0.34, 1.56, 0.64, 1)',
                        maxWidth: 380,
                        letterSpacing: '-0.01em',
                        border: '1px solid rgba(255,255,255,0.2)',
                    }}
                >
                    <div
                        style={{
                            width: 32,
                            height: 32,
                            borderRadius: '50%',
                            background: 'rgba(255,255,255,0.25)',
                            display: 'flex',
                            alignItems: 'center',
                            justifyContent: 'center',
                            flexShrink: 0,
                        }}
                    >
                        <i className={`fas ${c.icon}`} style={{ fontSize: 14 }}></i>
                    </div>
                    <span style={{ flex: 1, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
                        {notif.message}
                    </span>
                </div>
            );
        };

        // ================================================================
        // VIEWER APP
        // ================================================================
        const ViewerApp = () => {
            const [site, setSite] = useState(null);
            const [activeTab, setActiveTab] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [wholeFullscreen, setWholeFullscreen] = useState(false);
            const audioCtx = useContext(AudioContext);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    setWholeFullscreen(true);
                } else {
                    document.exitFullscreen();
                    setWholeFullscreen(false);
                }
            };

            useEffect(() => {
                const handleChange = () => setWholeFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleChange);
                return () => document.removeEventListener('fullscreenchange', handleChange);
            }, []);

            // Expose audioCtx globally for CustomUploads
            useEffect(() => { window.__audioCtx = audioCtx; }, [audioCtx]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const siteId = params.get('site');
                if (!siteId) { setError('No site ID provided.'); setLoading(false); return; }

                console.log('🌍 Public viewer loading site:', siteId);

                fetch(`/api/public/site/${siteId}?t=${Date.now()}`, { cache: 'no-store' })
                    .then(r => {
                        console.log('📥 Response status:', r.status);
                        if (!r.ok) throw new Error(r.status === 404 ? 'Site not found' : 'Failed to load');
                        return r.json();
                    })
                    .then(site => {
                        console.log('✅ Site loaded:', site.name);
                        setSite({ ...site.data, name: site.name });
                        setActiveTab(site.data?.activeTab || 'main');
                        document.title = site.name || 'Presenter';
                        setLoading(false);
                    })
                    .catch(e => {
                        console.error('❌ Load error:', e);
                        setError(e.message);
                        setLoading(false);
                    });
            }, []);

            // Auto-refresh every 5 seconds for live updates
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const siteId = params.get('site');
                if (!siteId) return;

                const interval = setInterval(() => {
                    fetch(`/api/load-site/${siteId}?t=${Date.now()}`, { cache: 'no-store' })
                        .then(r => r.ok ? r.json() : null)
                        .then(data => {
                            if (data && data.updatedAt !== site?.updatedAt) {
                                setSite(data);
                                setActiveTab(data.activeTab || 'main');
                            }
                        })
                        .catch(() => {});
                }, 5000);

                return () => clearInterval(interval);
            }, [site?.updatedAt]);

            // Set the browser tab title to the site name
            useEffect(() => {
                if (site?.name) document.title = site.name;
            }, [site?.name]);

            if (loading) return <div className="flex items-center justify-center h-screen text-gray-400">Loading…</div>;
            if (error) return <div className="flex items-center justify-center h-screen text-red-500">Error: {error}</div>;
            if (!site) return null;

            const tabs = site.tabs || [{ id: 'main', label: 'Main' }];
            const components = site.components || [];
            const activeItems = components.filter(c => c.tab === activeTab);

            return (
                <div style={{
                    minHeight: '100vh',
                    background: site.bgColor
                        ? `linear-gradient(135deg, ${site.bgColor} 0%, ${site.bgColor}dd 100%)`
                        : 'linear-gradient(135deg, #F8F9FA 0%, #E6F7FA 100%)',
                    padding: '48px 20px 120px',
                    fontFamily: 'inherit',
                }}>
                    <button className="fullscreen-toggle" onClick={toggleFullscreen}>
                        <i className={`fas ${wholeFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                        {wholeFullscreen ? 'Exit' : 'Fullscreen'}
                    </button>
                    <div style={{
                        maxWidth: 800,
                        margin: '0 auto',
                        background: '#fff',
                        borderRadius: 24,
                        boxShadow: '0 24px 60px rgba(17, 35, 59, 0.08), 0 8px 20px rgba(17, 35, 59, 0.04)',
                        overflow: 'hidden',
                        border: '1px solid rgba(17, 35, 59, 0.04)',
                    }}>
                        {/* Header */}
                        <div style={{
                            padding: '48px 56px 32px',
                            textAlign: 'center',
                            borderBottom: '1px solid #F1F5F9',
                            background: 'linear-gradient(180deg, #fff 0%, #FAFBFC 100%)',
                        }}>
                            {site.logoUrl && (
                                <img
                                    src={site.logoUrl}
                                    alt="Logo"
                                    style={{ maxHeight: 80, width: 'auto', objectFit: 'contain', margin: '0 auto 20px', display: 'block', filter: 'drop-shadow(0 4px 12px rgba(0,0,0,0.08))' }}
                                />
                            )}
                            <h1 style={{ fontSize: 36, fontWeight: 800, color: '#11233B', margin: 0, letterSpacing: '-0.02em' }}>
                                {site.name || 'Event'}
                            </h1>
                        </div>

                        {/* Tabs */}
                        {tabs.length > 1 && (
                            <div style={{ display: 'flex', justifyContent: 'center', gap: 32, padding: '0 56px', borderBottom: '1px solid #F1F5F9', background: '#fff' }}>
                                {tabs.map(t => (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)}
                                        style={{
                                            background: 'none', border: 'none', cursor: 'pointer',
                                            padding: '18px 0', fontFamily: 'inherit',
                                            fontWeight: 700, fontSize: 13, letterSpacing: '0.05em', textTransform: 'uppercase',
                                            color: activeTab === t.id ? '#11233B' : '#9CA3AF',
                                            borderBottom: activeTab === t.id ? '3px solid #0090A8' : '3px solid transparent',
                                            transition: 'all 200ms'
                                        }}>{t.label}</button>
                                ))}
                            </div>
                        )}

                        {/* Content */}
                        <div style={{ padding: '40px 56px' }}>
                            {activeItems.length === 0 ? (
                                <div style={{ textAlign: 'center', color: '#9CA3AF', padding: '64px 0', fontSize: 14 }}>
                                    <i className="fas fa-inbox" style={{ fontSize: 48, opacity: 0.3, display: 'block', marginBottom: 16 }}></i>
                                    No content on this page.
                                </div>
                            ) : activeItems.map(item => renderBlock(item, audioCtx, site.media))}
                        </div>

                        {/* Footer */}
                        <div style={{
                            padding: '24px 56px',
                            background: 'linear-gradient(180deg, #FAFBFC 0%, #F1F5F9 100%)',
                            textAlign: 'center',
                            fontSize: 11,
                            letterSpacing: '0.15em',
                            textTransform: 'uppercase',
                            color: '#9CA3AF',
                            fontWeight: 600,
                            borderTop: '1px solid #F1F5F9',
                        }}>
                            Powered by <span style={{ color: '#0090A8' }}>Podi@UM</span>
                        </div>
                    </div>

                    <FloatingAudioPlayer audioCtx={audioCtx} visible={true} />
                    <LoadingToast audioCtx={audioCtx} />
                </div>
            );
        };

        // ================================================================
        // ROOT — loads fadeDuration before mounting the audio provider
        // ================================================================
        const Root = () => {
            const [fadeDuration, setFadeDuration] = useState(800);

            // Load site data early so the audio provider knows the fade duration
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const siteId = params.get('site');
                if (!siteId) return;
                fetch(`/api/public/site/${siteId}?t=${Date.now()}`, { cache: 'no-store' })
                    .then(r => r.ok ? r.json() : null)
                    .then(data => {
                        const fade = Number(data?.data?.fadeDuration);
                        if (Number.isFinite(fade) && fade >= 0) setFadeDuration(fade);
                    })
                    .catch(() => {});
            }, []);

            return (
                <AudioProvider fadeDuration={fadeDuration}>
                    <ViewerApp />
                </AudioProvider>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
    </script>
</body>
</html>
