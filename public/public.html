<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Podi@UM - Projector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000000;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        #slide-display {
            width: 100vw;
            height: 100vh;
            background: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: none;
            border-radius: 0;
            box-shadow: none;
        }
        #slide-display img[src=""] { display: none; }
        #slide-display img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            border: none;
            border-radius: 0;
        }
    </style>
</head>
<body>
    <div id="slide-display">
        <img id="public-slide" src="" alt="Current slide" />
        <canvas id="medal-canvas" width="1920" height="1080" style="display:none;width:100%;height:100%;object-fit:contain;background:#fff"></canvas>
    </div>

    <script src="podium.js"></script>
    <script>
        // ============================================================
        // PROJECTOR – listens to BroadcastChannel
        // ============================================================
        const channel = new BroadcastChannel('presenter_hdmi');
        const slideImg = document.getElementById('public-slide');
        const medalCanvas = document.getElementById('medal-canvas');
        let medalAnim = null;
        let CONFIG = null;

        // Load config for backdrop/template paths
        async function loadConfig() {
            try {
                const resp = await fetch('/api/config');
                if (resp.ok) {
                    CONFIG = await resp.json();
                    console.log('✅ Projector: loaded config');
                    return;
                }
            } catch (e) {}
            CONFIG = {
                backdropImage: 'backdrop.png',
                templateImage: 'template.png',
                eventLogo: 'event-logo.png'
            };
        }

        const loadImg = (src) =>
            new Promise((res) => {
                const im = new Image();
                im.onload = () => res(im);
                im.onerror = () => res(null);
                im.src = src;
            });

        channel.onmessage = (event) => {
            const data = event.data;
            if (!data) return;
            if (data.action === 'navigateSlide') {
                stopMedal();
                slideImg.src = data.dataURL;
                slideImg.style.display = '';
                medalCanvas.style.display = 'none';
                document.title = `📺 Slide ${data.index + 1}`;
            } else if (data.action === 'medalSlide') {
                showMedal(data.logos, data.tie, data.sport);
            } else if (data.action === 'backdrop') {
                showBackdrop();
            }
        };

        // ---- Backdrop ----
        async function showBackdrop() {
            await loadConfig();
            const b = await loadImg(CONFIG.backdropImage);
            const logo = await loadImg(CONFIG.eventLogo || 'event-logo.png');
            stopMedal();
            const ctx = medalCanvas.getContext('2d');
            ctx.drawImage(b, 0, 0, 1920, 1080);
            if (logo) {
                Podium.drawContained(ctx, logo, 80, 80, 400, 300, 0.05);
            }
            slideImg.style.display = 'none';
            medalCanvas.style.display = 'block';
            document.title = '📺 Backdrop';
        }

        // ---- Animated Podium ----
        async function showMedal(logos, tie, sport) {
            await loadConfig();
            const tpl = await loadImg(CONFIG.templateImage);
            if (!tpl) return;
            stopMedal();

            const ctx = medalCanvas.getContext('2d');
            const base = document.createElement('canvas');
            base.width = 1920;
            base.height = 1080;

            const tiers = CONFIG.tiers || [{ id: 'winner', label: '🏆 Winner', color: '#ffd700' }];
            const rects = Podium.drawBase(base.getContext('2d'), tpl, tiers);

            if (sport) {
                const img = await loadImg(sport.logo);
                if (img) Podium.drawSport(base.getContext('2d'), img, sport.name);
            }

            const cloths = [];
            let i = 0;
            for (const tierId in rects) {
                const logo = logos[tierId] ? await loadImg(logos[tierId]) : null;
                const cloth = Podium.makeCloth(tpl, tie, rects[tierId], logo);
                cloths.push({ rect: rects[tierId], cloth, phase: i++ * 1.7 });
            }

            slideImg.style.display = 'none';
            medalCanvas.style.display = 'block';
            const t0 = performance.now();

            function frame(now) {
                const t = (now - t0) / 1000;
                ctx.drawImage(base, 0, 0);
                for (const c of cloths) {
                    Podium.drawWaving(ctx, c.cloth, c.rect, t, c.phase);
                }
                medalAnim = requestAnimationFrame(frame);
            }
            medalAnim = requestAnimationFrame(frame);
            document.title = '📺 Podium slide';
        }

        function stopMedal() {
            if (medalAnim) cancelAnimationFrame(medalAnim);
            medalAnim = null;
            medalCanvas.style.display = 'none';
            slideImg.style.display = '';
        }

        // ---- Init ----
        showBackdrop();
        console.log('📺 Projector ready.');
    </script>
</body>
</html>
