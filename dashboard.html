<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard – Site Builder</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #1a1a2e; }
        .topbar { background: #fff; padding: 12px 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #e0e0e0; }
        .topbar .logo { font-size: 1.4rem; font-weight: 700; color: #0d9488; display: flex; align-items: center; gap: 8px; }
        .topbar .actions { display: flex; gap: 12px; }
        .btn { padding: 8px 18px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: #0d9488; color: #fff; }
        .btn-primary:hover { background: #0f766e; }
        .btn-secondary { background: #e2e8f0; color: #1a1a2e; }
        .btn-secondary:hover { background: #cbd5e1; }
        .hero-banner { background: linear-gradient(135deg, #0d9488, #0f766e); margin: 20px 30px; padding: 40px 50px; border-radius: 16px; color: #fff; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 20px; }
        .hero-banner h2 { font-size: 2rem; font-weight: 300; }
        .hero-banner h2 strong { font-weight: 700; }
        .hero-banner .btn { background: #fff; color: #0d9488; padding: 12px 28px; border-radius: 30px; font-weight: 700; }
        .toolbar { display: flex; justify-content: space-between; padding: 0 30px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px; }
        .toolbar .search-box { display: flex; align-items: center; background: #fff; border-radius: 8px; padding: 4px 12px; border: 1px solid #e0e0e0; flex: 1; min-width: 200px; max-width: 400px; }
        .toolbar .search-box input { border: none; padding: 8px 10px; width: 100%; font-size: 0.9rem; outline: none; }
        .project-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; padding: 0 30px 40px; }
        .project-card { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); transition: 0.2s; cursor: pointer; overflow: hidden; border: 1px solid #e8eaed; }
        .project-card:hover { box-shadow: 0 8px 24px rgba(0,0,0,0.10); transform: translateY(-4px); }
        .project-card .card-preview { height: 120px; background: #f8fafc; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #94a3b8; border-bottom: 1px solid #e8eaed; position: relative; }
        .project-card .card-body { padding: 16px; display: flex; flex-direction: column; gap: 6px; }
        .project-card .card-body .title { font-weight: 700; font-size: 1.1rem; }
        .project-card .card-body .meta { font-size: 0.8rem; color: #94a3b8; }
        .project-card .card-body .actions { display: flex; gap: 8px; margin-top: 8px; justify-content: flex-end; }
        .project-card .card-body .actions button { background: none; border: none; cursor: pointer; font-size: 0.9rem; color: #64748b; transition: 0.2s; padding: 4px 8px; border-radius: 4px; }
        .project-card .card-body .actions button:hover { background: #f1f5f9; color: #0d9488; }
        .project-card .card-body .actions .delete-btn:hover { color: #cc0000; background: #fee2e2; }
        .empty-state { grid-column: 1 / -1; text-align: center; padding: 60px 20px; color: #94a3b8; }
        .empty-state i { font-size: 3rem; margin-bottom: 12px; display: block; color: #cbd5e1; }
        #loginOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        #loginBox { background: white; padding: 40px; border-radius: 16px; max-width: 400px; width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); }
        #loginBox h2 { margin-bottom: 8px; }
        #loginBox p { opacity: 0.6; margin-bottom: 20px; }
        #loginBox input { width: 100%; padding: 10px; border: 2px solid #cbd5e1; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; }
        #loginBox .btn { width: 100%; padding: 12px; }
        .login-error { color: #cc0000; font-size: 0.9rem; margin-top: 8px; display: none; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div id="loginBox">
            <h2>🔐 Welcome</h2>
            <p>Enter the admin password to access the dashboard.</p>
            <input type="password" id="passwordInput" placeholder="Password" />
            <button class="btn btn-primary" id="loginBtn">Log In</button>
            <div class="login-error" id="loginError">Wrong password. Try again.</div>
        </div>
    </div>

    <div id="dashboardContent" style="display:none;">
        <div class="topbar">
            <div class="logo"><i class="fas fa-wand-magic-sparkles"></i> SiteBuilder</div>
            <div class="actions">
                <button class="btn btn-primary" id="createSiteBtn"><i class="fas fa-plus"></i> Create New Site</button>
                <button class="btn btn-secondary" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </div>

        <div class="hero-banner">
            <div>
                <h2>Start creating something <strong>new</strong></h2>
                <p>Design, build, and publish stunning websites with AI assistance.</p>
            </div>
            <button class="btn" id="heroCreateBtn"><i class="fas fa-rocket"></i> Create New Site</button>
        </div>

        <div class="toolbar">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" id="searchInput" placeholder="Search your sites..." />
            </div>
        </div>

        <div class="project-grid" id="projectGrid"></div>
    </div>

    <script>
        // ================================================================
        // CLOUDINARY CONFIG
        // ================================================================
        const CLOUDINARY_CLOUD_NAME = 'ulww3nal';
        const CLOUDINARY_UPLOAD_PRESET = 'audio_uploads';

        // ================================================================
        // AUTH
        // ================================================================
        let token = localStorage.getItem('podiumToken');

        async function apiFetch(endpoint, options = {}) {
            const headers = {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token,
                ...options.headers,
            };
            const resp = await fetch(endpoint, { ...options, headers });
            if (!resp.ok) throw new Error((await resp.json()).error || 'API error');
            return resp.json();
        }

        // ================================================================
        // CLOUDINARY UPLOAD (auto endpoint)
        // ================================================================
        async function uploadToCloudinary(content, publicId) {
            const blob = new Blob([JSON.stringify(content)], { type: 'application/json' });
            const file = new File([blob], `${publicId}.json`, { type: 'application/json' });
            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('public_id', publicId);
            // ❌ REMOVE overwrite - not allowed
            // formData.append('overwrite', 'true');
            // Use auto/upload instead of raw/upload
            const resp = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, {
                method: 'POST',
                body: formData,
            });
            if (!resp.ok) {
                const err = await resp.text();
                console.error('Cloudinary error:', err);
                throw new Error('Upload failed: ' + err);
            }
            return (await resp.json()).secure_url;
        }

        // ================================================================
        // LOGIN / LOGOUT
        // ================================================================
        async function login(password) {
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const data = await resp.json();
                if (data.success) {
                    localStorage.setItem('podiumToken', data.token);
                    token = data.token;
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('dashboardContent').style.display = 'block';
                    loadSites();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', () => login(document.getElementById('passwordInput').value));
        document.getElementById('passwordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(e.target.value); });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('podiumToken');
            location.reload();
        });

        if (token) {
            apiFetch('/api/verify').then(() => {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('dashboardContent').style.display = 'block';
                loadSites();
            }).catch(() => {
                localStorage.removeItem('podiumToken');
                token = null;
            });
        }

        // ================================================================
        // SITE MANAGEMENT (list in localStorage, data on Cloudinary)
        // ================================================================
        let sites = [];

        function loadSites() {
            const saved = localStorage.getItem('podiumSiteList');
            sites = saved ? JSON.parse(saved) : [];
            renderSites();
        }

        function saveSiteList() {
            localStorage.setItem('podiumSiteList', JSON.stringify(sites));
        }

        function renderSites(filter = '', search = '') {
            const grid = document.getElementById('projectGrid');
            let filtered = [...sites];

            if (search.trim()) {
                const q = search.trim().toLowerCase();
                filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
            }

            filtered.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p>No sites yet. Click <strong>Create New Site</strong> to get started.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = filtered.map(site => `
                <div class="project-card" data-id="${site.id}">
                    <div class="card-preview">📄</div>
                    <div class="card-body">
                        <div class="title">${site.name}</div>
                        <div class="meta">Updated ${new Date(site.updatedAt).toLocaleDateString()}</div>
                        <div class="actions">
                            <button class="edit-btn"><i class="fas fa-pen"></i> Edit</button>
                            <button class="delete-btn"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.project-card').forEach(card => {
                const id = card.dataset.id;
                card.addEventListener('click', (e) => {
                    if (e.target.closest('button')) return;
                    openSite(id);
                });
                card.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); openSite(id); });
                card.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!confirm('Delete this site?')) return;
                    sites = sites.filter(s => s.id !== id);
                    saveSiteList();
                    loadSites();
                });
            });
        }

        function openSite(id) {
            window.location.href = `builder.html?site=${id}`;
        }

        async function createNewSite() {
            const id = 'site-' + Date.now();
            const newSite = {
                id,
                name: 'Untitled Site',
                components: [],
                tabs: [{ id: 'main', label: 'Main' }],
                activeTab: 'main',
                logoUrl: '',
                bgColor: '#f8fafc',
                topBarColor: '#ffffff',
                media: [],
                createdAt: new Date().toISOString(),
                updatedAt: new Date().toISOString(),
            };

            try {
                // Save via server (signed upload)
                const resp = await fetch('/api/save-site', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token,
                    },
                    body: JSON.stringify({ siteId: id, siteData: newSite }),
                });
                if (!resp.ok) throw new Error((await resp.json()).error || 'Save failed');

                // Add to localStorage site list
                sites.push({ id, name: newSite.name, createdAt: newSite.createdAt, updatedAt: newSite.updatedAt });
                saveSiteList();

                window.location.href = `builder.html?site=${id}`;
            } catch (e) {
                console.error('Create site error:', e);
                alert('Failed to create site: ' + e.message);
            }
        }

        document.getElementById('createSiteBtn').addEventListener('click', createNewSite);
        document.getElementById('heroCreateBtn').addEventListener('click', createNewSite);
        document.getElementById('searchInput').addEventListener('input', (e) => renderSites('', e.target.value));
    </script>
</body>
</html>
