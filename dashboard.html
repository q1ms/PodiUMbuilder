<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — Podi@UM</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        body { background: var(--color-bg-subtle); }
        .topbar {
            background: #fff;
            border-bottom: 1px solid var(--color-gray-lighter);
            padding: var(--space-4) 0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo-mark {
            width: 36px; height: 36px;
            background: linear-gradient(135deg, var(--color-brand), var(--color-navy));
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 800;
            font-size: 18px;
        }
        .hero {
            background: linear-gradient(135deg, var(--color-brand) 0%, var(--color-brand-dark) 100%);
            border-radius: var(--radius-xl);
            padding: var(--space-12) var(--space-10);
            color: #fff;
            margin: var(--space-8) 0;
            position: relative;
            overflow: hidden;
        }
        .hero::before {
            content: '';
            position: absolute;
            top: -50%; right: -10%;
            width: 400px; height: 400px;
            background: rgba(255,255,255,0.1);
            border-radius: 50%;
        }
        .hero::after {
            content: '';
            position: absolute;
            bottom: -30%; left: 30%;
            width: 300px; height: 300px;
            background: rgba(255,255,255,0.06);
            border-radius: 50%;
        }
        .hero > * { position: relative; z-index: 1; }
        .hero h1 { font-size: var(--text-display); color: #fff; margin-bottom: var(--space-3); }
        .hero p { color: rgba(255,255,255,0.85); font-size: var(--text-h4); font-weight: 400; max-width: 500px; }

        .toolbar {
            display: flex;
            gap: var(--space-4);
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-6);
            flex-wrap: wrap;
        }
        .search-box {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            background: #fff;
            border: 1px solid var(--color-gray-lighter);
            border-radius: var(--radius-md);
            padding: 0 var(--space-4);
            height: 40px;
            flex: 1;
            min-width: 240px;
            max-width: 400px;
            transition: all var(--transition-fast);
        }
        .search-box:focus-within {
            border-color: var(--color-brand);
            box-shadow: 0 0 0 3px var(--color-brand-tint);
        }
        .search-box i { color: var(--color-gray-light); font-size: 14px; }
        .search-box input {
            border: none;
            outline: none;
            flex: 1;
            font-family: var(--font-family);
            font-size: var(--text-sm);
            color: var(--color-navy);
            background: transparent;
        }

        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: var(--space-6);
            padding-bottom: var(--space-12);
        }
        .project-card {
            background: #fff;
            border: 1px solid var(--color-gray-lighter);
            border-radius: var(--radius-lg);
            overflow: hidden;
            cursor: pointer;
            transition: all var(--transition-base);
        }
        .project-card:hover {
            border-color: var(--color-brand);
            box-shadow: var(--shadow-lg);
            transform: translateY(-4px);
        }
        .project-preview {
            height: 140px;
            background: linear-gradient(135deg, var(--color-bg-tint) 0%, var(--color-brand-tint) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            font-size: 40px;
            color: var(--color-brand);
        }
        .project-body { padding: var(--space-5); }
        .project-title {
            font-size: var(--text-h4);
            font-weight: 600;
            color: var(--color-navy);
            margin-bottom: var(--space-2);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .project-meta {
            font-size: var(--text-xs);
            color: var(--color-gray-light);
            display: flex;
            align-items: center;
            gap: var(--space-2);
            margin-bottom: var(--space-4);
        }
        .project-actions {
            display: flex;
            gap: var(--space-2);
            justify-content: flex-end;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: var(--space-16) var(--space-6);
            color: var(--color-gray);
        }
        .empty-state i { font-size: 48px; color: var(--color-gray-lighter); margin-bottom: var(--space-4); display: block; }

        /* Login page */
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-6);
            background: linear-gradient(135deg, var(--color-bg-subtle) 0%, var(--color-brand-tint) 100%);
        }
        .login-card {
            background: #fff;
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-xl);
            padding: var(--space-10);
            max-width: 420px;
            width: 100%;
        }
    </style>
</head>
<body>

    <!-- ===== LOGIN ===== -->
    <div id="loginOverlay" class="login-wrapper">
        <div class="login-card animate-slide">
            <div class="logo-mark" style="width:48px;height:48px;font-size:24px;margin-bottom:var(--space-6);">P</div>
            <h1 class="t-h2" style="margin-bottom:var(--space-2);">Welcome back</h1>
            <p class="t-body" style="margin-bottom:var(--space-8);">Sign in to manage your event sites.</p>
            <label class="label">Password</label>
            <input type="password" id="passwordInput" class="input input-lg" placeholder="Enter admin password" autofocus style="margin-bottom:var(--space-4);" />
            <button class="btn btn-primary btn-lg btn-full" id="loginBtn">Sign In</button>
            <div class="login-error" id="loginError" style="color:var(--color-danger);font-size:var(--text-sm);margin-top:var(--space-3);display:none;">Incorrect password. Please try again.</div>
        </div>
    </div>

    <!-- ===== DASHBOARD ===== -->
    <div id="dashboardContent" style="display:none;">
        <div class="topbar">
            <div class="container" style="display:flex;align-items:center;justify-content:space-between;">
                <div style="display:flex;align-items:center;gap:var(--space-3);">
                    <div class="logo-mark">P</div>
                    <div>
                        <div style="font-weight:700;color:var(--color-navy);font-size:var(--text-h4);">Podi@UM</div>
                        <div style="font-size:var(--text-xs);color:var(--color-gray-light);">Event Presentation System</div>
                    </div>
                </div>
                <div style="display:flex;gap:var(--space-3);">
                    <button class="btn btn-secondary" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</button>
                </div>
            </div>
        </div>

        <div class="container">
            <div class="hero">
                <h1>Your Event Sites</h1>
                <p>Design, build, and publish branded presentations for any event.</p>
                <button class="btn btn-lg" id="heroCreateBtn" style="background:#fff;color:var(--color-brand);margin-top:var(--space-6);">
                    <i class="fas fa-plus"></i> Create New Site
                </button>
            </div>

            <div class="toolbar">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Search your sites…" />
                </div>
                <button class="btn btn-primary" id="createSiteBtn"><i class="fas fa-plus"></i> New Site</button>
            </div>

            <div class="project-grid" id="projectGrid"></div>
        </div>
    </div>

    <script>
        const CLOUDINARY_CLOUD_NAME = 'ulww3nal';
        const CLOUDINARY_UPLOAD_PRESET = 'audio_uploads';

        let token = localStorage.getItem('podiumToken');
        const loginOverlay = document.getElementById('loginOverlay');
        const dashboardContent = document.getElementById('dashboardContent');

        function showLogin() {
            loginOverlay.style.display = 'flex';
            dashboardContent.style.display = 'none';
        }
        function showDashboard() {
            loginOverlay.style.display = 'none';
            dashboardContent.style.display = 'block';
        }

        async function apiFetch(endpoint, options = {}) {
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (token) headers['Authorization'] = 'Bearer ' + token;
            const resp = await fetch(endpoint, { ...options, headers });
            if (resp.status === 401) {
                localStorage.removeItem('podiumToken');
                token = null;
                throw new Error('Unauthorized');
            }
            const data = await resp.json();
            if (!resp.ok) throw new Error(data.error || 'API error');
            return data;
        }

        async function login(password) {
            try {
                const resp = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password }),
                });
                const data = await resp.json();
                if (data.success) {
                    localStorage.setItem('podiumToken', data.token);
                    token = data.token;
                    showDashboard();
                    loadSites();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            } catch (e) {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        document.getElementById('loginBtn').addEventListener('click', () => login(document.getElementById('passwordInput').value));
        document.getElementById('passwordInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') login(e.target.value); });
        document.getElementById('logoutBtn').addEventListener('click', () => { localStorage.removeItem('podiumToken'); location.reload(); });

        // ===== Sites =====
        let sites = [];
        function loadSites() {
            sites = JSON.parse(localStorage.getItem('podiumSiteList') || '[]');
            renderSites();
        }
        function saveSiteList() {
            localStorage.setItem('podiumSiteList', JSON.stringify(sites));
        }

        function renderSites(search = '') {
            const grid = document.getElementById('projectGrid');
            let filtered = [...sites];
            if (search.trim()) {
                const q = search.trim().toLowerCase();
                filtered = filtered.filter(s => s.name.toLowerCase().includes(q));
            }
            filtered.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <h3 class="t-h4" style="margin-bottom:var(--space-2);">No sites yet</h3>
                        <p class="t-body">Click <strong>Create New Site</strong> to get started.</p>
                    </div>`;
                return;
            }

            grid.innerHTML = filtered.map(site => `
                <div class="project-card animate-slide" data-id="${site.id}">
                    <div class="project-preview"><i class="fas fa-file-alt"></i></div>
                    <div class="project-body">
                        <div class="project-title">${site.name}</div>
                        <div class="project-meta"><i class="fas fa-clock"></i> Updated ${new Date(site.updatedAt).toLocaleDateString()}</div>
                        <div class="project-actions">
                            <button class="btn btn-sm btn-ghost edit-btn"><i class="fas fa-pen"></i> Edit</button>
                            <button class="btn btn-sm btn-ghost delete-btn" style="color:var(--color-danger);"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>
            `).join('');

            grid.querySelectorAll('.project-card').forEach(card => {
                const id = card.dataset.id;
                card.addEventListener('click', (e) => { if (!e.target.closest('button')) openSite(id); });
                card.querySelector('.edit-btn').addEventListener('click', (e) => { e.stopPropagation(); openSite(id); });
                card.querySelector('.delete-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!confirm('Delete this site?')) return;
                    sites = sites.filter(s => s.id !== id);
                    saveSiteList(); loadSites();
                });
            });
        }

        function openSite(id) { window.location.href = `builder.html?site=${id}`; }

        async function createNewSite() {
            const id = 'site-' + Date.now();
            const newSite = {
                id, name: 'Untitled Site',
                createdAt: new Date().toISOString(), updatedAt: new Date().toISOString(),
            };
            sites.push(newSite);
            saveSiteList();
            // Save site JSON to Cloudinary
            try {
                const blob = new Blob([JSON.stringify({ id, name: newSite.name, components: [], tabs: [{ id: 'main', label: 'Main' }], activeTab: 'main', logoUrl: '', bgColor: '#ffffff', topBarColor: '#ffffff', media: [] })], { type: 'application/json' });
                const file = new File([blob], `${id}.json`, { type: 'application/json' });
                const formData = new FormData();
                formData.append('file', file);
                formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
                await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/auto/upload`, { method: 'POST', body: formData });
            } catch (e) { console.error(e); }
            window.location.href = `builder.html?site=${id}`;
        }

        document.getElementById('createSiteBtn').addEventListener('click', createNewSite);
        document.getElementById('heroCreateBtn').addEventListener('click', createNewSite);
        document.getElementById('searchInput').addEventListener('input', (e) => renderSites(e.target.value));

        // ===== Boot =====
        showLogin();
        if (token) {
            fetch('/api/verify', { headers: { 'Authorization': 'Bearer ' + token } })
                .then(r => {
                    if (r.ok) { showDashboard(); loadSites(); }
                    else { localStorage.removeItem('podiumToken'); token = null; showLogin(); }
                })
                .catch(() => { localStorage.removeItem('podiumToken'); token = null; showLogin(); });
        }
    </script>
</body>
</html>
