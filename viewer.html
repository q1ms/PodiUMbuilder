<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/styles.css" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
    <style>
        html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
        #root { min-height: 100vh; }
        .audio-progress { width: 100%; accent-color: #0d9488; }
        .audio-volume { width: 100px; accent-color: #0d9488; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, createContext, useContext, useCallback } = React;

        // ================================================================
        // AUDIO CONTEXT
        // ================================================================
        const AudioContext = createContext(null);

        const AudioProvider = ({ children }) => {
            const [audioUrl, setAudioUrl] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(1.0);
            const [endedCounter, setEndedCounter] = useState(0);
            const audioRef = useRef(null);
            const fadeIntervalRef = useRef(null);

            useEffect(() => {
                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audio.preload = 'auto';
                audioRef.current = audio;
                const onTime = () => { if (audio.duration) setProgress((audio.currentTime / audio.duration) * 100); };
                const onMeta = () => setDuration(audio.duration);
                const onEnd = () => {
                    setIsPlaying(false);
                    setProgress(0);
                    setEndedCounter(c => c + 1);  // ← signals a track naturally ended
                };
                audio.addEventListener('timeupdate', onTime);
                audio.addEventListener('loadedmetadata', onMeta);
                audio.addEventListener('ended', onEnd);
                return () => {
                    audio.pause(); audio.src = '';
                    if (fadeIntervalRef.current) clearInterval(fadeIntervalRef.current);
                    audio.removeEventListener('timeupdate', onTime);
                    audio.removeEventListener('loadedmetadata', onMeta);
                    audio.removeEventListener('ended', onEnd);
                };
            }, []);

            const fadeTo = (targetVol, duration = 800, callback) => {
                const audio = audioRef.current;
                if (!audio) return;
                if (fadeIntervalRef.current) clearInterval(fadeIntervalRef.current);

                const startVol = audio.volume;
                const startTime = Date.now();
                const steps = 30;
                const stepTime = duration / steps;

                fadeIntervalRef.current = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const ratio = Math.min(1, elapsed / duration);
                    audio.volume = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * ratio));
                    if (ratio >= 1) {
                        clearInterval(fadeIntervalRef.current);
                        fadeIntervalRef.current = null;
                        if (callback) callback();
                    }
                }, stepTime);
            };

            const play = (url) => {
                const audio = audioRef.current;
                if (!audio) return;

                // Only reload if the source is actually different
                // Compare normalized URLs to avoid false mismatches
                const currentSrc = audio.src ? audio.src.split('?')[0] : '';
                const targetSrc = url.split('?')[0];

                if (currentSrc !== targetSrc) {
                    // Different track — reset and load
                    audio.src = url;
                    audio.load();
                }
                // If same track, we don't touch src — position is preserved

                audio.volume = 0;
                audio.play().then(() => {
                    setIsPlaying(true);
                    fadeTo(volume, 800); // fade IN
                }).catch((err) => {
                    console.error('Play failed:', err);
                });
                setAudioUrl(url);
            };

            const pause = () => {
                const audio = audioRef.current;
                if (!audio) return;
                fadeTo(0, 600, () => {   // fade OUT
                    audio.pause();
                    setIsPlaying(false);
                    // ← No audio.currentTime = 0 here! Position is preserved.
                });
            };

            // Resume from current position without reloading the source
            const resume = () => {
                const audio = audioRef.current;
                if (!audio) return;
                // Ensure we have a valid source
                if (!audio.src) return;
                // Don't reset currentTime, don't call load()
                audio.volume = 0;
                audio.play().then(() => {
                    setIsPlaying(true);
                    fadeTo(volume, 800);
                }).catch((err) => {
                    console.error('Resume failed:', err);
                });
            };

            // Stop all sounds — PRESERVES position (for resume)
            const stopAll = () => {
                const audio = audioRef.current;
                if (!audio) return;
                fadeTo(0, 600, () => {
                    audio.pause();
                    setIsPlaying(false);
                    // ← Do NOT reset currentTime (position is preserved)
                    // ← Do NOT clear audioUrl (so resume can find it)
                });
            };

            // Full reset — clears position (used for explicit "Stop & Reset")
            const resetAll = () => {
                const audio = audioRef.current;
                if (!audio) return;
                fadeTo(0, 600, () => {
                    audio.pause();
                    audio.currentTime = 0;
                    setIsPlaying(false);
                    setProgress(0);
                    setAudioUrl(null);
                });
            };
            const togglePlay = (url) => {
                if (!url) return;
                if (audioUrl === url && isPlaying) pause(); else play(url);
            };
            const seek = (v) => {
                const audio = audioRef.current;
                if (!audio || !audio.duration) return;
                audio.currentTime = (v / 100) * audio.duration;
                setProgress(v);
            };
            const changeVolume = (v) => {
                const vol = v / 100;
                setVolume(vol);
                if (audioRef.current) audioRef.current.volume = vol;
            };
            const playBeep = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.frequency.value = 880; osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
                } catch (e) {}
            };

            return (
                <AudioContext.Provider value={{
                    audioUrl,
                    isPlaying,
                    progress,
                    duration,
                    volume,
                    play,
                    pause,
                    resume,
                    togglePlay,
                    seek,
                    changeVolume,
                    playBeep,
                    stopAll,      // ← stop, but keep position
                    resetAll,     // ← stop AND reset to 0
                    endedCounter,
                }}>
                    {children}
                </AudioContext.Provider>
            );
        };

        // ================================================================
        // BLOCK RENDERERS (view-only, playable)
        // ================================================================
        function formatTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        const SoundButtonBlock = ({ props, audioCtx }) => {
            const buttonLabel = props.label || 'Play Sound';
            const isThisPlaying = audioCtx.audioUrl === props.audioUrl && audioCtx.isPlaying;

            return (
                <div className="mb-4">
                    <button
                        onClick={() => props.audioUrl ? audioCtx.togglePlay(props.audioUrl) : audioCtx.playBeep()}
                        style={{ background: props.color || '#1a1a2e' }}
                        className="w-full rounded-full hover:opacity-90 text-white text-base font-bold py-5 transition-all shadow-lg flex items-center justify-center gap-3"
                    >
                        <i className={`fas ${isThisPlaying ? 'fa-pause' : 'fa-play'} text-xl`}></i>
                        <span>{buttonLabel}</span>
                    </button>
                </div>
            );
        };

        const PlaylistBlock = ({ props, audioCtx }) => {
            const tracks = props.tracks || [];
            const [currentIdx, setCurrentIdx] = useState(null);
            const [isPlaylistActive, setIsPlaylistActive] = useState(false);
            const [isPlaylistPlaying, setIsPlaylistPlaying] = useState(false);

            // ============================================================
            // AUTO-ADVANCE — only fires when a track naturally ENDS
            // (uses endedCounter, not isPlaying, so pause doesn't trigger it)
            // ============================================================
            const lastHandledEndRef = useRef(0);
            useEffect(() => {
                if (!isPlaylistPlaying || currentIdx === null) return;
                if (!audioCtx.endedCounter) return;
                // Avoid double-firing on the same ended event
                if (audioCtx.endedCounter === lastHandledEndRef.current) return;
                lastHandledEndRef.current = audioCtx.endedCounter;

                const nextIdx = currentIdx + 1;
                if (nextIdx < tracks.length) {
                    setCurrentIdx(nextIdx);
                    audioCtx.play(tracks[nextIdx].url);
                } else {
                    // End of playlist — reset
                    setIsPlaylistPlaying(false);
                    setIsPlaylistActive(false);
                    setCurrentIdx(null);
                }
            }, [audioCtx.endedCounter, isPlaylistPlaying, currentIdx, tracks]);

            // If user plays a different track externally, stop playlist mode
            useEffect(() => {
                if (!isPlaylistActive) return;
                if (currentIdx === null) return;
                if (audioCtx.audioUrl && audioCtx.audioUrl !== tracks[currentIdx]?.url) {
                    setIsPlaylistPlaying(false);
                    setIsPlaylistActive(false);
                    setCurrentIdx(null);
                }
            }, [audioCtx.audioUrl]);

            const handlePlayPause = () => {
                if (tracks.length === 0) return;

                // CASE 1: Playing → pause (keep currentIdx + currentTime)
                if (isPlaylistPlaying && audioCtx.isPlaying) {
                    audioCtx.pause();
                    setIsPlaylistPlaying(false);
                    return;
                }

                // CASE 2: Paused mid-track → resume SAME track from SAME position
                if (isPlaylistActive && currentIdx !== null && audioCtx.audioUrl === tracks[currentIdx]?.url) {
                    setIsPlaylistPlaying(true);
                    audioCtx.resume();   // ← use resume, NOT play()
                    return;
                }

                // CASE 3: Fresh start
                setIsPlaylistActive(true);
                setIsPlaylistPlaying(true);
                setCurrentIdx(0);
                audioCtx.play(tracks[0].url);
            };

            const stopPlaylist = () => {
                setIsPlaylistPlaying(false);
                setIsPlaylistActive(false);
                setCurrentIdx(null);
                // Use resetAll so this button actually resets to the beginning
                if (audioCtx.resetAll) {
                    audioCtx.resetAll();
                } else {
                    audioCtx.stopAll ? audioCtx.stopAll() : audioCtx.pause();
                }
            };

            const playTrack = (idx) => {
                // If clicking the same paused track, just resume
                if (isPlaylistActive && currentIdx === idx && !audioCtx.isPlaying) {
                    setIsPlaylistPlaying(true);
                    audioCtx.resume();
                    return;
                }
                // Otherwise start that track fresh
                setCurrentIdx(idx);
                setIsPlaylistActive(true);
                setIsPlaylistPlaying(true);
                audioCtx.play(tracks[idx].url);
            };

            // Button label logic
            let buttonLabel = 'Play Playlist';
            let buttonIcon = 'fa-play';
            let buttonColor = 'var(--color-navy)';

            if (isPlaylistPlaying && audioCtx.isPlaying) {
                buttonLabel = 'Pause Playlist';
                buttonIcon = 'fa-pause';
                buttonColor = '#F59E0B';
            } else if (isPlaylistActive && currentIdx !== null) {
                buttonLabel = `Resume · ${tracks[currentIdx]?.name || ''}`;
                buttonIcon = 'fa-play';
                buttonColor = 'var(--color-brand)';
            }

            return (
                <div className="viewer-playlist">
                    <div className="viewer-playlist-title">{props.title || 'Playlist'}</div>

                    {tracks.length > 0 && (
                        <>
                            <button
                                onClick={handlePlayPause}
                                style={{
                                    width: '100%',
                                    padding: '18px',
                                    borderRadius: '14px',
                                    background: buttonColor,
                                    color: '#fff',
                                    border: 'none',
                                    fontFamily: 'inherit',
                                    fontSize: '16px',
                                    fontWeight: 700,
                                    cursor: 'pointer',
                                    display: 'flex',
                                    alignItems: 'center',
                                    justifyContent: 'center',
                                    gap: '12px',
                                    marginBottom: isPlaylistActive ? '10px' : '16px',
                                    boxShadow: '0 4px 12px rgba(0,0,0,0.15)',
                                    transition: 'all 150ms',
                                }}
                            >
                                <i className={`fas ${buttonIcon}`} style={{ fontSize: '18px' }}></i>
                                {buttonLabel}
                            </button>

                            {/* Stop button — only shows when playlist is active */}
                            {isPlaylistActive && (
                                <button
                                    onClick={stopPlaylist}
                                    style={{
                                        width: '100%',
                                        padding: '10px',
                                        borderRadius: '10px',
                                        background: 'transparent',
                                        color: 'var(--color-gray)',
                                        border: '1px solid var(--color-gray-lighter)',
                                        fontFamily: 'inherit',
                                        fontSize: '13px',
                                        fontWeight: 600,
                                        cursor: 'pointer',
                                        display: 'flex',
                                        alignItems: 'center',
                                        justifyContent: 'center',
                                        gap: '8px',
                                        marginBottom: '16px',
                                        transition: 'all 150ms',
                                    }}
                                >
                                    <i className="fas fa-stop"></i> Stop & Reset
                                </button>
                            )}
                        </>
                    )}

                    {tracks.length === 0 ? (
                        <div style={{ textAlign: 'center', color: 'var(--color-gray-light)', fontSize: 13, padding: '20px 0' }}>
                            No tracks added yet
                        </div>
                    ) : (
                        tracks.map((track, i) => {
                            const isCurrent = currentIdx === i;
                            const isPlayingThis = isCurrent && audioCtx.isPlaying && isPlaylistPlaying;
                            return (
                                <div
                                    key={i}
                                    className={`viewer-track ${isPlayingThis ? 'playing' : ''}`}
                                    onClick={() => playTrack(i)}
                                >
                                    <div className="viewer-track-icon" style={isCurrent && !isPlayingThis ? { background: 'var(--color-gray)' } : undefined}>
                                        <i className={`fas ${isPlayingThis ? 'fa-pause' : 'fa-play'}`}></i>
                                    </div>
                                    <div className="viewer-track-name">
                                        {track.name}
                                        {isCurrent && !isPlayingThis && (
                                            <span style={{ fontSize: 11, color: 'var(--color-gray-light)', marginLeft: 8 }}>
                                                (paused)
                                            </span>
                                        )}
                                    </div>
                                    {isPlayingThis && (
                                        <div style={{ fontSize: 11, color: 'var(--color-brand)', fontWeight: 600 }}>
                                            ● LIVE
                                        </div>
                                    )}
                                </div>
                            );
                        })
                    )}
                </div>
            );
        };

        const CustomUploadsBlock = ({ props }) => (
            <div className="mb-4">
                <div className="text-sm font-semibold text-gray-700 mb-1">{props.title || 'Custom Uploads'}</div>
                {props.subtitle && <div className="text-xs text-gray-400 mb-2">{props.subtitle}</div>}
                <div className="border-2 border-dashed border-gray-300 rounded-xl py-6 text-center text-sm text-gray-400 cursor-pointer hover:border-gray-400 transition-colors">
                    <label className="cursor-pointer block">
                        <span>🎵 Click to browse audio</span>
                        <input type="file" accept="audio/*" className="hidden"
                            onChange={(e) => {
                                const file = e.target.files[0];
                                if (file) {
                                    const url = URL.createObjectURL(file);
                                    window.__audioCtx?.play(url);
                                }
                            }} />
                    </label>
                </div>
            </div>
        );

        const SlidesManagerBlock = ({ props }) => {
            const [slides, setSlides] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [fullscreen, setFullscreen] = useState(false);
            const [autoplay, setAutoplay] = useState(false);
            const [autoplayProgress, setAutoplayProgress] = useState(0);

            const AUTOPLAY_DURATION = 5000; // 5 seconds per slide

            const handleFiles = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                const newSlides = [];
                for (const file of files) {
                    if (file.type === 'application/pdf') {
                        // Load PDF
                        if (!window.pdfjsLib) {
                            await new Promise((resolve) => {
                                const script = document.createElement('script');
                                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                                script.onload = () => {
                                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                                    resolve();
                                };
                                document.head.appendChild(script);
                            });
                        }
                        const buffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const viewport = page.getViewport({ scale: 2 });
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
                            newSlides.push(canvas.toDataURL('image/png'));
                        }
                    } else if (file.type.startsWith('image/')) {
                        const dataURL = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve(ev.target.result);
                            reader.readAsDataURL(file);
                        });
                        newSlides.push(dataURL);
                    }
                }
                setSlides(prev => [...prev, ...newSlides]);
                e.target.value = '';
            };

            const goNext = () => slides.length && setCurrentIndex((currentIndex + 1) % slides.length);
            const goPrev = () => slides.length && setCurrentIndex((currentIndex - 1 + slides.length) % slides.length);
            const goTo = (idx) => setCurrentIndex(idx);

            const deleteSlide = (idx) => {
                const updated = slides.filter((_, i) => i !== idx);
                setSlides(updated);
                if (currentIndex >= updated.length) setCurrentIndex(Math.max(0, updated.length - 1));
            };

            const moveSlide = (idx, direction) => {
                const newIdx = idx + direction;
                if (newIdx < 0 || newIdx >= slides.length) return;
                const updated = [...slides];
                [updated[idx], updated[newIdx]] = [updated[newIdx], updated[idx]];
                setSlides(updated);
                if (currentIndex === idx) setCurrentIndex(newIdx);
                else if (currentIndex === newIdx) setCurrentIndex(idx);
            };

            // Keyboard controls (both preview and fullscreen)
            useEffect(() => {
                const handleKey = (e) => {
                    if (!fullscreen && !autoplay) return;
                    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); goNext(); }
                    if (e.key === 'ArrowLeft') { e.preventDefault(); goPrev(); }
                    if (e.key === 'Escape') setFullscreen(false);
                    if (e.key === 'f' || e.key === 'F') setFullscreen(f => !f);
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [fullscreen, autoplay, slides.length, currentIndex]);

            // Autoplay
            useEffect(() => {
                if (!autoplay || slides.length <= 1) return;
                setAutoplayProgress(0);
                const startTime = Date.now();
                const interval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const progress = Math.min(100, (elapsed / AUTOPLAY_DURATION) * 100);
                    setAutoplayProgress(progress);
                    if (elapsed >= AUTOPLAY_DURATION) {
                        goNext();
                        setAutoplayProgress(0);
                    }
                }, 50);
                return () => clearInterval(interval);
            }, [autoplay, currentIndex, slides.length]);
            return (
                <div className="slide-presenter">
                    {props.title && <div className="viewer-playlist-title">{props.title}</div>}

                    {/* Upload zone */}
                    <div className="border-2 border-dashed border-gray-200 rounded-xl py-4 text-center text-sm text-gray-400 hover:border-gray-400 transition-colors cursor-pointer mb-4">
                        <label className="cursor-pointer block">
                            <span>📄 Click to upload PDF / PNG / JPEG</span>
                            <input type="file" multiple accept="image/*,application/pdf" className="hidden" onChange={handleFiles} />
                        </label>
                    </div>

                    {slides.length > 0 && (
                        <>
                            {/* Viewport */}
                            <div className="slide-viewport" onClick={() => setFullscreen(true)} style={{ cursor: 'zoom-in' }}>
                                <img src={slides[currentIndex]} alt={`Slide ${currentIndex + 1}`} />
                                {autoplay && (
                                    <div className="slide-autoplay-bar" style={{ width: autoplayProgress + '%' }}></div>
                                )}
                            </div>

                            {/* Navigation */}
                            <div className="slide-nav">
                                <button className="btn btn-secondary btn-sm" onClick={goPrev}>
                                    <i className="fas fa-chevron-left"></i> Prev
                                </button>
                                <div className="slide-counter">
                                    {currentIndex + 1} / {slides.length}
                                </div>
                                <button className="btn btn-secondary btn-sm" onClick={goNext}>
                                    Next <i className="fas fa-chevron-right"></i>
                                </button>
                            </div>

                            {/* Secondary controls */}
                            <div style={{ display: 'flex', justifyContent: 'center', gap: 8, marginBottom: 16, flexWrap: 'wrap' }}>
                                <button className="btn btn-primary btn-sm" onClick={() => setFullscreen(true)}>
                                    <i className="fas fa-expand"></i> Present
                                </button>
                                <button
                                    className={`btn btn-sm ${autoplay ? 'btn-danger' : 'btn-secondary'}`}
                                    onClick={() => setAutoplay(!autoplay)}
                                >
                                    <i className={`fas ${autoplay ? 'fa-pause' : 'fa-play'}`}></i>
                                    {autoplay ? ' Stop' : ' Auto-advance'}
                                </button>
                            </div>

                            {/* Thumbnails */}
                            <div className="slide-thumbs">
                                {slides.map((s, i) => (
                                    <div key={i} className={`slide-thumb-item ${i === currentIndex ? 'active' : ''}`}>
                                        <img src={s} alt={`Slide ${i + 1}`} onClick={() => goTo(i)} />
                                        <span className="thumb-num">{i + 1}</span>
                                        <div style={{ display: 'flex', justifyContent: 'space-between', padding: 2 }}>
                                            <button
                                                onClick={(e) => { e.stopPropagation(); moveSlide(i, -1); }}
                                                disabled={i === 0}
                                                style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 10, color: '#64748B', padding: 2 }}
                                                title="Move left"
                                            >◀</button>
                                            <button
                                                onClick={(e) => { e.stopPropagation(); deleteSlide(i); }}
                                                style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 10, color: '#EF4444', padding: 2 }}
                                                title="Delete"
                                            >✕</button>
                                            <button
                                                onClick={(e) => { e.stopPropagation(); moveSlide(i, 1); }}
                                                disabled={i === slides.length - 1}
                                                style={{ background: 'none', border: 'none', cursor: 'pointer', fontSize: 10, color: '#64748B', padding: 2 }}
                                                title="Move right"
                                            >▶</button>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </>
                    )}

                    {/* Fullscreen mode */}
                    {fullscreen && (
                        <div className="slide-fullscreen" onClick={(e) => { if (e.target === e.currentTarget) setFullscreen(false); }}>
                            <img src={slides[currentIndex]} alt={`Slide ${currentIndex + 1}`} />
                            {autoplay && (
                                <div className="slide-autoplay-bar" style={{
                                    position: 'fixed',
                                    bottom: 0,
                                    left: 0,
                                    height: 4,
                                    width: autoplayProgress + '%',
                                    background: 'var(--color-brand)',
                                    transition: 'width 100ms linear',
                                    zIndex: 100000,
                                }}></div>
                            )}
                            <div className="slide-fullscreen-controls">
                                <button onClick={goPrev} title="Previous (←)"><i className="fas fa-chevron-left"></i></button>
                                <span className="fs-counter">{currentIndex + 1} / {slides.length}</span>
                                <button onClick={goNext} title="Next (→ or Space)"><i className="fas fa-chevron-right"></i></button>
                                <div style={{ width: 1, height: 20, background: 'rgba(255,255,255,0.2)' }}></div>
                                <button onClick={() => setAutoplay(!autoplay)} title="Auto-advance">
                                    <i className={`fas ${autoplay ? 'fa-pause' : 'fa-play'}`}></i>
                                </button>
                                <button onClick={() => setFullscreen(false)} title="Exit (Esc)"><i className="fas fa-times"></i></button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ProgressControlsBlock = ({ props, audioCtx }) => (
            <div className="mb-4 bg-gray-50 rounded-xl p-4">
                <div className="text-xs text-gray-500 mb-2 flex justify-between">
                    <span>{props.title || 'Now Playing'}</span>
                    <span>{audioCtx.isPlaying ? '▶ Playing' : (audioCtx.audioUrl ? '⏸ Paused' : '⏸ Idle')}</span>
                </div>

                {/* Progress bar - full width */}
                <input type="range" min="0" max="100" value={audioCtx.progress}
                    onChange={(e) => audioCtx.seek(parseFloat(e.target.value))} className="audio-progress w-full" />
                <div className="flex justify-between text-xs text-gray-400 mt-1">
                    <span>{audioCtx.duration ? formatTime((audioCtx.progress / 100) * audioCtx.duration) : '0:00'}</span>
                    <span>{audioCtx.duration ? formatTime(audioCtx.duration) : '0:00'}</span>
                </div>

                {/* Volume slider - 85% width, centered */}
                <div className="flex items-center justify-center gap-3 mt-4">
                    <span className="text-sm text-gray-500">🔊</span>
                    <input type="range" min="0" max="100" value={audioCtx.volume * 100}
                        onChange={(e) => audioCtx.changeVolume(parseFloat(e.target.value))}
                        style={{ width: '85%' }}
                        className="audio-volume" />
                    <span className="text-xs text-gray-400 w-8 text-right">{Math.round(audioCtx.volume * 100)}%</span>
                </div>

                {/* Pause All Sounds — keeps position, so it can be resumed again */}
                <div className="flex justify-center mt-3">
                    <button
                        onClick={() => {
                            if (audioCtx.isPlaying) {
                                // Pause everything, but KEEP the position (resumable)
                                audioCtx.stopAll && audioCtx.stopAll();
                            } else if (audioCtx.audioUrl) {
                                // Something is loaded but paused → resume from same position
                                audioCtx.resume && audioCtx.resume();
                            }
                        }}
                        style={{ width: '75%', background: audioCtx.isPlaying ? '#EF4444' : 'var(--color-brand)' }}
                        className="text-base font-semibold text-white hover:opacity-90 px-6 py-3 rounded-full transition-colors">
                        {audioCtx.isPlaying
                            ? '⏸ Pause All Sounds'
                            : (audioCtx.audioUrl ? '▶ Resume All Sounds' : '⏸ Pause All Sounds')}
                    </button>
                </div>
            </div>
        );

        const DividerBlock = ({ props }) => (
            <div className="flex items-center gap-3 my-4">
                <div className="flex-1 h-0.5 rounded" style={{ background: props.color || '#d1d5db' }}></div>
                {props.label && <span className="text-sm font-semibold text-gray-500 tracking-wide">{props.label}</span>}
                <div className="flex-1 h-0.5 rounded" style={{ background: props.color || '#d1d5db' }}></div>
            </div>
        );

        const CountdownBlock = ({ props }) => {
            const defaultSeconds = props.defaultSeconds || 300;
            const [secondsLeft, setSecondsLeft] = useState(defaultSeconds);
            const [running, setRunning] = useState(false);
            const [initialSeconds, setInitialSeconds] = useState(defaultSeconds);

            useEffect(() => {
                if (!running) return;
                if (secondsLeft <= 0) {
                    setRunning(false);
                    return;
                }
                const timer = setInterval(() => {
                    setSecondsLeft(s => {
                        if (s <= 1) { setRunning(false); return 0; }
                        return s - 1;
                    });
                }, 1000);
                return () => clearInterval(timer);
            }, [running, secondsLeft]);

            const format = (s) => {
                const m = Math.floor(s / 60);
                const sec = s % 60;
                return `${m}:${sec.toString().padStart(2, '0')}`;
            };

            const setMinutes = (mins) => {
                const s = mins * 60;
                setSecondsLeft(s);
                setInitialSeconds(s);
                setRunning(false);
            };

            // Warning at <60s, danger at <15s
            let className = 'countdown-display';
            if (secondsLeft < 60 && secondsLeft > 15) className += ' warning';
            else if (secondsLeft <= 15 && secondsLeft > 0) className += ' danger';

            return (
                <div className="countdown-block" style={{ background: `linear-gradient(135deg, ${props.color || '#11233B'}, ${props.color || '#11233B'}dd)` }}>
                    <div className={className}>{format(secondsLeft)}</div>
                    <div className="countdown-label">{props.title || 'Countdown'}</div>

                    <div className="countdown-controls">
                        <button className="primary" onClick={() => setRunning(!running)}>
                            <i className={`fas ${running ? 'fa-pause' : 'fa-play'}`}></i> {running ? 'Pause' : 'Start'}
                        </button>
                        <button onClick={() => { setRunning(false); setSecondsLeft(initialSeconds); }}>
                            <i className="fas fa-redo"></i> Reset
                        </button>
                        <button onClick={() => setMinutes(1)}>1m</button>
                        <button onClick={() => setMinutes(3)}>3m</button>
                        <button onClick={() => setMinutes(5)}>5m</button>
                        <button onClick={() => setMinutes(10)}>10m</button>
                    </div>
                </div>
            );
        };

        function renderBlock(item, audioCtx, media) {
            const { type, props } = item;
            switch (type) {
                case 'SoundButton': return <SoundButtonBlock key={item.id} props={props} audioCtx={audioCtx} media={media} />;
                case 'Playlist': return <PlaylistBlock key={item.id} props={props} audioCtx={audioCtx} media={media} />;
                case 'CustomUploads': return <CustomUploadsBlock key={item.id} props={props} />;
                case 'SlidesManager': return <SlidesManagerBlock key={item.id} props={props} />;
                case 'ProgressControls': return <ProgressControlsBlock key={item.id} props={props} audioCtx={audioCtx} />;
                case 'Divider': return <DividerBlock key={item.id} props={props} />;
                case 'Countdown': return <CountdownBlock key={item.id} props={props} />;
                default: return null;
            }
        }

        // ================================================================
        // VIEWER APP
        // ================================================================
        const ViewerApp = () => {
            const [site, setSite] = useState(null);
            const [activeTab, setActiveTab] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [wholeFullscreen, setWholeFullscreen] = useState(false);
            const audioCtx = useContext(AudioContext);

            const toggleFullscreen = () => {
                if (!document.fullscreenElement) {
                    document.documentElement.requestFullscreen();
                    setWholeFullscreen(true);
                } else {
                    document.exitFullscreen();
                    setWholeFullscreen(false);
                }
            };

            useEffect(() => {
                const handleChange = () => setWholeFullscreen(!!document.fullscreenElement);
                document.addEventListener('fullscreenchange', handleChange);
                return () => document.removeEventListener('fullscreenchange', handleChange);
            }, []);

            // Expose audioCtx globally for CustomUploads
            useEffect(() => { window.__audioCtx = audioCtx; }, [audioCtx]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const siteId = params.get('site');
                if (!siteId) { setError('No site ID provided.'); setLoading(false); return; }

                console.log('🌍 Public viewer loading site:', siteId);

                fetch(`/api/public/site/${siteId}?t=${Date.now()}`, { cache: 'no-store' })
                    .then(r => {
                        console.log('📥 Response status:', r.status);
                        if (!r.ok) throw new Error(r.status === 404 ? 'Site not found' : 'Failed to load');
                        return r.json();
                    })
                    .then(site => {
                        console.log('✅ Site loaded:', site.name);
                        setSite({ ...site.data, name: site.name });
                        setActiveTab(site.data?.activeTab || 'main');
                        document.title = site.name || 'Presenter';
                        setLoading(false);
                    })
                    .catch(e => {
                        console.error('❌ Load error:', e);
                        setError(e.message);
                        setLoading(false);
                    });
            }, []);

            // Auto-refresh every 5 seconds for live updates
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const siteId = params.get('site');
                if (!siteId) return;

                const interval = setInterval(() => {
                    fetch(`/api/load-site/${siteId}?t=${Date.now()}`, { cache: 'no-store' })
                        .then(r => r.ok ? r.json() : null)
                        .then(data => {
                            if (data && data.updatedAt !== site?.updatedAt) {
                                setSite(data);
                                setActiveTab(data.activeTab || 'main');
                            }
                        })
                        .catch(() => {});
                }, 5000);

                return () => clearInterval(interval);
            }, [site?.updatedAt]);

            // Set the browser tab title to the site name
            useEffect(() => {
                if (site?.name) document.title = site.name;
            }, [site?.name]);

            if (loading) return <div className="flex items-center justify-center h-screen text-gray-400">Loading…</div>;
            if (error) return <div className="flex items-center justify-center h-screen text-red-500">Error: {error}</div>;
            if (!site) return null;

            const tabs = site.tabs || [{ id: 'main', label: 'Main' }];
            const components = site.components || [];
            const activeItems = components.filter(c => c.tab === activeTab);

            return (
                <div style={{ minHeight: '100vh', background: site.bgColor || '#F8F9FA', padding: '32px 16px' }}>
                    <button className="fullscreen-toggle" onClick={toggleFullscreen}>
                        <i className={`fas ${wholeFullscreen ? 'fa-compress' : 'fa-expand'}`}></i>
                        {wholeFullscreen ? 'Exit' : 'Fullscreen'}
                    </button>
                    <div style={{ maxWidth: 720, margin: '0 auto', background: '#fff', borderRadius: 24, boxShadow: '0 20px 50px rgba(17, 35, 59, 0.12)', overflow: 'hidden' }}>
                        {/* Header - CENTERED logo + name */}
                        <div style={{
                            padding: '32px 40px',
                            borderBottom: '1px solid #E5E7EB',
                            display: 'flex',
                            flexDirection: 'column',
                            alignItems: 'center',
                            gap: '12px',
                            textAlign: 'center'
                        }}>
                            {site.logoUrl && (
                                <img
                                    src={site.logoUrl}
                                    alt="Logo"
                                    style={{ maxHeight: 80, width: 'auto', objectFit: 'contain' }}
                                />
                            )}
                            <h1 style={{
                                fontSize: '28px',
                                fontWeight: 700,
                                color: '#11233B',
                                margin: 0,
                                letterSpacing: '-0.01em'
                            }}>
                                {site.name || 'Event'}
                            </h1>
                        </div>

                        {/* Tabs */}
                        {tabs.length > 1 && (
                            <div style={{ display: 'flex', justifyContent: 'center', gap: 24, padding: '0 40px', borderBottom: '1px solid #E5E7EB' }}>
                                {tabs.map(t => (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)}
                                        style={{
                                            background: 'none', border: 'none', cursor: 'pointer',
                                            padding: '16px 0', fontFamily: 'inherit',
                                            fontWeight: 600, fontSize: '14px',
                                            color: activeTab === t.id ? '#11233B' : '#9CA3AF',
                                            borderBottom: activeTab === t.id ? '2px solid #0090A8' : '2px solid transparent',
                                            transition: 'all 150ms'
                                        }}>{t.label}</button>
                                ))}
                            </div>
                        )}

                        {/* Content */}
                        <div style={{ padding: '32px 40px' }}>
                            {activeItems.length === 0 ? (
                                <div style={{ textAlign: 'center', color: '#9CA3AF', padding: '48px 0' }}>
                                    No content on this page.
                                </div>
                            ) : activeItems.map(item => renderBlock(item, audioCtx, site.media))}
                        </div>

                        {/* Footer */}
                        <div style={{ padding: '20px 40px', background: '#F8F9FA', textAlign: 'center', fontSize: '12px', color: '#9CA3AF' }}>
                            Powered by <strong style={{ color: '#0090A8' }}>Podi@UM</strong>
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            <AudioProvider>
                <ViewerApp />
            </AudioProvider>
        );
    </script>
</body>
</html>
