<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Presenter</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        html, body { height: 100%; margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
        #root { min-height: 100vh; }
        .audio-progress { width: 100%; accent-color: #0d9488; }
        .audio-volume { width: 100px; accent-color: #0d9488; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useRef, useEffect, createContext, useContext, useCallback } = React;

        // ================================================================
        // AUDIO CONTEXT
        // ================================================================
        const AudioContext = createContext(null);

        const AudioProvider = ({ children }) => {
            const [audioUrl, setAudioUrl] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [progress, setProgress] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.8);
            const audioRef = useRef(null);
            const fadeIntervalRef = useRef(null);

            useEffect(() => {
                const audio = new Audio();
                audio.crossOrigin = 'anonymous';
                audio.preload = 'auto';
                audioRef.current = audio;
                const onTime = () => { if (audio.duration) setProgress((audio.currentTime / audio.duration) * 100); };
                const onMeta = () => setDuration(audio.duration);
                const onEnd = () => { setIsPlaying(false); setProgress(0); };
                audio.addEventListener('timeupdate', onTime);
                audio.addEventListener('loadedmetadata', onMeta);
                audio.addEventListener('ended', onEnd);
                return () => {
                    audio.pause(); audio.src = '';
                    if (fadeIntervalRef.current) clearInterval(fadeIntervalRef.current);
                    audio.removeEventListener('timeupdate', onTime);
                    audio.removeEventListener('loadedmetadata', onMeta);
                    audio.removeEventListener('ended', onEnd);
                };
            }, []);

            const fadeTo = (targetVol, duration = 1000, callback) => {
                const audio = audioRef.current;
                if (!audio) return;
                if (fadeIntervalRef.current) clearInterval(fadeIntervalRef.current);

                const startVol = audio.volume;
                const startTime = Date.now();
                const steps = 30;
                const stepTime = duration / steps;

                fadeIntervalRef.current = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const ratio = Math.min(1, elapsed / duration);
                    audio.volume = startVol + (targetVol - startVol) * ratio;
                    if (ratio >= 1) {
                        clearInterval(fadeIntervalRef.current);
                        if (callback) callback();
                    }
                }, stepTime);
            };

            const play = (url) => {
                const audio = audioRef.current;
                if (!audio) return;
                if (audio.src !== url) {
                    audio.src = url;
                    audio.load();
                    audio.volume = 0; // start at 0 for fade in
                } else {
                    audio.volume = 0;
                }
                audio.play().then(() => {
                    setIsPlaying(true);
                    fadeTo(volume, 800);
                }).catch(() => {});
                setAudioUrl(url);
            };

            const pause = () => {
                const audio = audioRef.current;
                if (!audio) return;
                fadeTo(0, 600, () => {
                    audio.pause();
                    setIsPlaying(false);
                });
            };
            const togglePlay = (url) => {
                if (!url) return;
                if (audioUrl === url && isPlaying) pause(); else play(url);
            };
            const seek = (v) => {
                const audio = audioRef.current;
                if (!audio || !audio.duration) return;
                audio.currentTime = (v / 100) * audio.duration;
                setProgress(v);
            };
            const changeVolume = (v) => {
                const vol = v / 100;
                setVolume(vol);
                if (audioRef.current) audioRef.current.volume = vol;
            };
            const playBeep = () => {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain); gain.connect(ctx.destination);
                    osc.frequency.value = 880; osc.type = 'sine';
                    gain.gain.setValueAtTime(0.3, ctx.currentTime);
                    osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.15);
                } catch (e) {}
            };

            return (
                <AudioContext.Provider value={{ audioUrl, isPlaying, progress, duration, volume, play, pause, togglePlay, seek, changeVolume, playBeep }}>
                    {children}
                </AudioContext.Provider>
            );
        };

        // ================================================================
        // BLOCK RENDERERS (view-only, playable)
        // ================================================================
        function formatTime(s) {
            if (!s || isNaN(s)) return '0:00';
            const m = Math.floor(s / 60);
            const sec = Math.floor(s % 60);
            return `${m}:${sec.toString().padStart(2, '0')}`;
        }

        const SoundButtonBlock = ({ props, audioCtx, media }) => {
            const [uploadProgress] = useState(0);
            const selectedName = media?.find(m => m.url === props.audioUrl)?.name || (props.audioUrl ? props.audioUrl.split('/').pop() : '');
            const buttonLabel = props.label || 'Sound Button';
            return (
                <div className="mb-4">
                    <button
                        onClick={() => props.audioUrl ? audioCtx.togglePlay(props.audioUrl) : audioCtx.playBeep()}
                        style={{ background: props.color || '#1a1a2e' }}
                        className="w-full rounded-full hover:opacity-90 text-white text-base font-semibold py-4 transition-all shadow-lg">
                        {props.audioUrl
                            ? (audioCtx.isPlaying && audioCtx.audioUrl === props.audioUrl ? '⏸ Pause' : '▶ Play ' + buttonLabel)
                            : '🔊 ' + buttonLabel}
                    </button>
                    {selectedName && (
                        <div className="text-xs text-gray-400 mt-2 text-center truncate">🎵 {selectedName}</div>
                    )}
                </div>
            );
        };

        const PlaylistBlock = ({ props, audioCtx, media }) => {
            const [playingIdx, setPlayingIdx] = useState(null);
            const tracks = props.tracks || [];
            const togglePlay = (i) => {
                const track = tracks[i];
                if (!track?.url) return;
                if (playingIdx === i && audioCtx.isPlaying) {
                    setPlayingIdx(null);
                    audioCtx.pause();
                } else {
                    setPlayingIdx(i);
                    audioCtx.play(track.url);
                }
            };
            return (
                <div className="mb-4">
                    <div className="text-sm font-semibold text-gray-700 mb-2">{props.title || 'Playlist'}</div>
                    <div className="flex flex-wrap gap-2">
                        {tracks.map((track, i) => (
                            <button key={i} onClick={() => togglePlay(i)}
                                className={`text-sm px-4 py-2 rounded-full border transition-all ${playingIdx === i && audioCtx.isPlaying ? 'bg-gray-800 text-white border-gray-800' : 'bg-white border-gray-300 text-gray-700 hover:bg-gray-50'}`}>
                                {playingIdx === i && audioCtx.isPlaying ? '⏸' : '▶'} {track.name}
                            </button>
                        ))}
                        {tracks.length === 0 && <div className="text-xs text-gray-400">No tracks</div>}
                    </div>
                </div>
            );
        };

        const CustomUploadsBlock = ({ props }) => (
            <div className="mb-4">
                <div className="text-sm font-semibold text-gray-700 mb-1">{props.title || 'Custom Uploads'}</div>
                {props.subtitle && <div className="text-xs text-gray-400 mb-2">{props.subtitle}</div>}
                <div className="border-2 border-dashed border-gray-300 rounded-xl py-6 text-center text-sm text-gray-400 cursor-pointer hover:border-gray-400 transition-colors">
                    <label className="cursor-pointer block">
                        <span>🎵 Click to browse audio</span>
                        <input type="file" accept="audio/*" className="hidden"
                            onChange={(e) => {
                                const file = e.target.files[0];
                                if (file) {
                                    const url = URL.createObjectURL(file);
                                    window.__audioCtx?.play(url);
                                }
                            }} />
                    </label>
                </div>
            </div>
        );

        const SlidesManagerBlock = ({ props }) => {
            const [slides, setSlides] = useState([]);
            const [currentIndex, setCurrentIndex] = useState(0);
            const [fullscreen, setFullscreen] = useState(false);

            const handleFiles = async (e) => {
                const files = Array.from(e.target.files);
                if (!files.length) return;

                const newSlides = [];
                for (const file of files) {
                    if (file.type === 'application/pdf') {
                        // Load PDF
                        if (!window.pdfjsLib) {
                            await new Promise((resolve) => {
                                const script = document.createElement('script');
                                script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
                                script.onload = () => {
                                    window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
                                    resolve();
                                };
                                document.head.appendChild(script);
                            });
                        }
                        const buffer = await file.arrayBuffer();
                        const pdf = await window.pdfjsLib.getDocument({ data: buffer }).promise;
                        for (let i = 1; i <= pdf.numPages; i++) {
                            const page = await pdf.getPage(i);
                            const viewport = page.getViewport({ scale: 1.5 });
                            const canvas = document.createElement('canvas');
                            canvas.width = viewport.width;
                            canvas.height = viewport.height;
                            const renderResult = page.render({ canvasContext: canvas.getContext('2d'), viewport });
                            await (renderResult.promise || renderResult);
                            newSlides.push(canvas.toDataURL('image/png'));
                        }
                    } else if (file.type.startsWith('image/')) {
                        const dataURL = await new Promise((resolve) => {
                            const reader = new FileReader();
                            reader.onload = (ev) => resolve(ev.target.result);
                            reader.readAsDataURL(file);
                        });
                        newSlides.push(dataURL);
                    }
                }
                setSlides(prev => [...prev, ...newSlides]);
                e.target.value = '';
            };

            const goNext = () => slides.length && setCurrentIndex((currentIndex + 1) % slides.length);
            const goPrev = () => slides.length && setCurrentIndex((currentIndex - 1 + slides.length) % slides.length);

            // Fullscreen presentation mode
            useEffect(() => {
                const handleKey = (e) => {
                    if (!fullscreen) return;
                    if (e.key === 'ArrowRight' || e.key === ' ') goNext();
                    if (e.key === 'ArrowLeft') goPrev();
                    if (e.key === 'Escape') setFullscreen(false);
                };
                window.addEventListener('keydown', handleKey);
                return () => window.removeEventListener('keydown', handleKey);
            }, [fullscreen, slides.length, currentIndex]);
            return (
                <div className="mb-4">
                    <div className="text-sm font-semibold text-gray-700 mb-2">{props.title || 'Slides'}</div>

                    {/* Upload area */}
                    <div className="border-2 border-dashed border-gray-300 rounded-xl py-4 text-center text-sm text-gray-400 cursor-pointer hover:border-gray-400 transition-colors mb-3">
                        <label className="cursor-pointer block">
                            <span>📄 Click to upload PDF / PNG / JPEG</span>
                            <input type="file" multiple accept="image/*,application/pdf" className="hidden" onChange={handleFiles} />
                        </label>
                    </div>

                    {slides.length > 0 && (
                        <>
                            {/* Preview */}
                            <div className="bg-black rounded-lg overflow-hidden mb-3" style={{ aspectRatio: '16/9' }}>
                                <img src={slides[currentIndex]} alt="Slide" className="w-full h-full object-contain" />
                            </div>

                            {/* Controls */}
                            <div className="flex items-center justify-between gap-2 mb-3">
                                <button onClick={goPrev} className="bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-full px-4 py-2 text-sm font-medium">◀ Prev</button>
                                <span className="text-xs text-gray-500">{currentIndex + 1} / {slides.length}</span>
                                <button onClick={goNext} className="bg-gray-200 hover:bg-gray-300 text-gray-700 rounded-full px-4 py-2 text-sm font-medium">Next ▶</button>
                                <button onClick={() => setFullscreen(true)} className="bg-emerald-600 hover:bg-emerald-700 text-white rounded-full px-4 py-2 text-sm font-medium">▶ Fullscreen</button>
                            </div>

                            {/* Thumbnails */}
                            <div className="flex gap-2 overflow-x-auto pb-2">
                                {slides.map((s, i) => (
                                    <img key={i} src={s} alt={`Thumb ${i + 1}`} onClick={() => setCurrentIndex(i)}
                                        className={`h-12 w-20 object-cover rounded cursor-pointer border-2 ${i === currentIndex ? 'border-emerald-500' : 'border-transparent'}`} />
                                ))}
                            </div>
                        </>
                    )}

                    {/* Fullscreen mode */}
                    {fullscreen && (
                        <div style={{
                            position: 'fixed', top: 0, left: 0, width: '100vw', height: '100vh',
                            background: 'black', zIndex: 999999, display: 'flex', alignItems: 'center', justifyContent: 'center'
                        }} onClick={(e) => { if (e.target === e.currentTarget) setFullscreen(false); }}>
                            <img src={slides[currentIndex]} alt="Slide" style={{ maxWidth: '100%', maxHeight: '100%', objectFit: 'contain' }} />
                            <div style={{ position: 'absolute', bottom: 20, left: '50%', transform: 'translateX(-50%)', display: 'flex', gap: 12, background: 'rgba(0,0,0,0.6)', padding: '10px 20px', borderRadius: 30 }}>
                                <button onClick={goPrev} style={{ color: 'white', background: 'none', border: 'none', fontSize: '1.5rem', cursor: 'pointer' }}>◀</button>
                                <span style={{ color: 'white', fontSize: '0.9rem', alignSelf: 'center' }}>{currentIndex + 1} / {slides.length}</span>
                                <button onClick={goNext} style={{ color: 'white', background: 'none', border: 'none', fontSize: '1.5rem', cursor: 'pointer' }}>▶</button>
                                <button onClick={() => setFullscreen(false)} style={{ color: 'white', background: 'none', border: 'none', fontSize: '1rem', cursor: 'pointer', marginLeft: 12 }}>✕ Exit</button>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const ProgressControlsBlock = ({ props, audioCtx }) => (
            <div className="mb-4 bg-gray-50 rounded-xl p-4">
                <div className="text-xs text-gray-500 mb-2 flex justify-between">
                    <span>{props.title || 'Now Playing'}</span>
                    <span>{audioCtx.audioUrl ? '▶ Playing' : '⏸ Idle'}</span>
                </div>
                <input type="range" min="0" max="100" value={audioCtx.progress}
                    onChange={(e) => audioCtx.seek(parseFloat(e.target.value))} className="audio-progress" />
                <div className="flex justify-between text-xs text-gray-400 mt-1">
                    <span>{audioCtx.duration ? formatTime((audioCtx.progress / 100) * audioCtx.duration) : '0:00'}</span>
                    <span>{audioCtx.duration ? formatTime(audioCtx.duration) : '0:00'}</span>
                </div>
                <div className="flex items-center gap-3 mt-3">
                    <span className="text-sm text-gray-500">🔊</span>
                    <input type="range" min="0" max="100" value={audioCtx.volume * 100}
                        onChange={(e) => audioCtx.changeVolume(parseFloat(e.target.value))} className="audio-volume" />
                    <span className="text-xs text-gray-400">{Math.round(audioCtx.volume * 100)}%</span>
                    <button onClick={() => audioCtx.audioUrl && audioCtx.togglePlay(audioCtx.audioUrl)}
                        className="text-sm font-semibold bg-gray-200 hover:bg-gray-300 px-5 py-2 rounded-full transition-colors"
                        style={{ background: props.color || '#e5e7eb' }}>
                        {audioCtx.isPlaying ? '⏸ Pause' : '▶ Play'}
                    </button>
                </div>
            </div>
        );

        const DividerBlock = ({ props }) => (
            <div className="flex items-center gap-3 my-4">
                <div className="flex-1 h-0.5 rounded" style={{ background: props.color || '#d1d5db' }}></div>
                {props.label && <span className="text-sm font-semibold text-gray-500 tracking-wide">{props.label}</span>}
                <div className="flex-1 h-0.5 rounded" style={{ background: props.color || '#d1d5db' }}></div>
            </div>
        );

        function renderBlock(item, audioCtx, media) {
            const { type, props } = item;
            switch (type) {
                case 'SoundButton': return <SoundButtonBlock key={item.id} props={props} audioCtx={audioCtx} media={media} />;
                case 'Playlist': return <PlaylistBlock key={item.id} props={props} audioCtx={audioCtx} media={media} />;
                case 'CustomUploads': return <CustomUploadsBlock key={item.id} props={props} />;
                case 'SlidesManager': return <SlidesManagerBlock key={item.id} props={props} />;
                case 'ProgressControls': return <ProgressControlsBlock key={item.id} props={props} audioCtx={audioCtx} />;
                case 'Divider': return <DividerBlock key={item.id} props={props} />;
                default: return null;
            }
        }

        // ================================================================
        // VIEWER APP
        // ================================================================
        const ViewerApp = () => {
            const [site, setSite] = useState(null);
            const [activeTab, setActiveTab] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const audioCtx = useContext(AudioContext);

            // Expose audioCtx globally for CustomUploads
            useEffect(() => { window.__audioCtx = audioCtx; }, [audioCtx]);

            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const siteId = params.get('site');
                if (!siteId) { setError('No site ID provided.'); setLoading(false); return; }

                // Force no-cache fetch
                fetch(`/api/load-site/${siteId}?t=${Date.now()}`, {
                    cache: 'no-store',
                    headers: {
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache'
                    }
                })
                    .then(r => { if (!r.ok) throw new Error('Failed to load'); return r.json(); })
                    .then(data => {
                        setSite(data);
                        setActiveTab(data.activeTab || data.tabs?.[0]?.id || 'main');
                        setLoading(false);
                    })
                    .catch(e => { setError(e.message); setLoading(false); });
            }, []);

            // Auto-refresh every 5 seconds for live updates
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                const siteId = params.get('site');
                if (!siteId) return;

                const interval = setInterval(() => {
                    fetch(`/api/load-site/${siteId}?t=${Date.now()}`, { cache: 'no-store' })
                        .then(r => r.ok ? r.json() : null)
                        .then(data => {
                            if (data && data.updatedAt !== site?.updatedAt) {
                                setSite(data);
                                setActiveTab(data.activeTab || 'main');
                            }
                        })
                        .catch(() => {});
                }, 5000);

                return () => clearInterval(interval);
            }, [site?.updatedAt]);

            if (loading) return <div className="flex items-center justify-center h-screen text-gray-400">Loading…</div>;
            if (error) return <div className="flex items-center justify-center h-screen text-red-500">Error: {error}</div>;
            if (!site) return null;

            const tabs = site.tabs || [{ id: 'main', label: 'Main' }];
            const components = site.components || [];
            const activeItems = components.filter(c => c.tab === activeTab);

            return (
                <div className="min-h-screen p-6" style={{ background: site.bgColor || '#f8fafc' }}>
                    <div className="max-w-3xl mx-auto bg-white rounded-2xl shadow-lg p-8">
                        {/* Header / Logo */}
                        <div className="flex items-center gap-4 mb-6 pb-4 border-b border-gray-200">
                            {site.logoUrl && <img src={site.logoUrl} alt="Logo" className="max-h-16 w-auto object-contain" />}
                            <h1 className="text-2xl font-bold text-gray-800">{site.name || 'Event'}</h1>
                        </div>

                        {/* Tabs (only show if more than one) */}
                        {tabs.length > 1 && (
                            <div className="flex gap-4 border-b border-gray-200 mb-6">
                                {tabs.map(t => (
                                    <button key={t.id} onClick={() => setActiveTab(t.id)}
                                        className={`pb-2 text-sm font-medium transition-colors ${activeTab === t.id ? 'text-gray-900 border-b-2 border-gray-900' : 'text-gray-400 hover:text-gray-600'}`}>
                                        {t.label}
                                    </button>
                                ))}
                            </div>
                        )}

                        {/* Blocks */}
                        {activeItems.length === 0 ? (
                            <div className="text-center text-gray-400 py-12">No content on this page.</div>
                        ) : (
                            activeItems.map(item => renderBlock(item, audioCtx, site.media))
                        )}

                        {/* Footer */}
                        <div className="mt-8 pt-4 border-t border-gray-200 text-xs text-gray-400 text-center">
                            Powered by Podi@UM
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.createRoot(document.getElementById('root')).render(
            <AudioProvider>
                <ViewerApp />
            </AudioProvider>
        );
    </script>
</body>
</html>
